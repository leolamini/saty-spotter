<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saty Spotter">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="A simple drill for Saty trigger and Golden Gate setups. Opens where you left off.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Saty Spotter</title>
  <style>

:root {
  --bg: #0e1116;
  --card: #161b22;
  --text: #e6edf3;
  --muted: #8b949e;
  --line: #30363d;
  --green: #3fb950;
  --green-bg: #16351f;
  --red: #f85149;
  --red-bg: #3d1618;
  --blue: #58a6ff;
  --btn: #21262d;
  --focus: #388bfd;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100%;
}
body {
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 8px 14px 24px; }
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0 2px;
}
.brand {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
}
.learn-link {
  background: none;
  border: none;
  color: var(--blue);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 4px;
  cursor: pointer;
}
.strip {
  font-size: 12px;
  color: var(--muted);
  padding: 2px 0 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 10px;
}
.chart svg { display: block; width: 100%; height: auto; max-height: 52vh; touch-action: pan-y; user-select: none; }
.caption { margin: 6px 0 10px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.prompt {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  margin: 0 0 12px;
}
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  width: 100%;
  min-height: 52px;
  padding: 14px 16px;
  font: inherit;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--text);
  cursor: pointer;
}
.opt.tone-long { background: var(--green-bg); color: var(--green); border-color: #238636; }
.opt.tone-short { background: var(--red-bg); color: var(--red); border-color: #da3633; }
.opt.tone-skip { background: #21262d; color: var(--muted); }
.opt:active { transform: scale(0.99); }
.verdict {
  padding: 12px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  margin: 4px 0 10px;
  border-left: 4px solid;
}
.verdict.ok { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.verdict.bad { background: var(--red-bg); color: #ff7b72; border-color: var(--red); }
.lesson p { margin: 0 0 10px; font-size: 15px; line-height: 1.45; color: var(--text); }
.learn h2, .learn h3 { margin: 16px 0 8px; font-size: 18px; }
.learn .rules { margin: 0; padding-left: 20px; }
.learn .rules li { margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
.pair { display: flex; flex-direction: column; gap: 14px; margin: 8px 0 16px; }
.pair-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.learn .opt { margin-top: 8px; }
@media (min-width: 640px) {
  .pair { flex-direction: row; }
  .pair > div { flex: 1; min-width: 0; }
}


.top-links { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.share-note {
  font-size: 12px;
  color: var(--muted);
  min-height: 0;
  padding: 0;
}
.share-note:not(:empty) { padding: 0 0 6px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--blue); }
.timer.warn { color: var(--red); }
  </style>
</head>

    if (q === "q2a") return "Did a 15-minute bar close outside the fence (the box between +23.6 and −23.6)?";
    if (q === "q2b") return "If it closed outside, was it out the side the ribbon points?";
    if (q === "qlook") return "What are you looking at? A fresh break through the trigger, a pullback after a break, or neither?";
    if (q === "q2f") return "Is this the first 15-minute close past the trigger, or has price already run to 61.8?";
    if (q === "q3") return "This is a pullback after a break. Did price tag 38.2, then pull back to the fast EMA (the 8) and hold, still beyond the trigger?";

  function setupName(code) {

  function guidedQueue(s) {

  function skillQid(id) {

    var look = lookWant(s);

    if (id === "fence") return similar ? s.q2 === "I" || s.q2 === "W" : s.q2 !== "I" && s.q2 !== "W";
    if (id === "side") return similar ? s.q2 === "D" : s.q2 !== "D";
    if (id === "fresh-pull") return similar ? look === "B" || look === "P" : look === "N";
    if (id === "fresh-stale") return similar ? s.tag === "st" || (s.q2 === "F" && s.tag === "tr") : s.tag === "gg" || s.tag === "ex" || s.tag === "nh";

  function lessonLines(s, id) {
    if (id === "ribbon") {
      return [
        s.q1 === "G" ? "The 8 is above the 21, and the 21 is above the 34 — green, fanned up." : s.q1 === "R" ? "The 8 is below the 21, and the 21 is below the 34 — red, fanned down." : "The 8, 21, and 34 are tangled or sitting on top of each other. That is twisted or flat.",
        "Trade only with a clearly fanned ribbon. Twisted or flat means stay out."

    }
    if (id === "fence") {
      return [
        s.q2 === "I" || s.q2 === "W" ? "The last 15-minute close is still inside the trigger fence (±23.6% of ATR from the prior day close)." : "A 15-minute bar has already closed outside that fence.",
        "First question: did a bar close outside the box? If not, there is no trigger trade yet."
      ];
    }
    if (id === "side") {
      return [
        s.q2 === "D" ? "Price closed outside the fence, but on the side the ribbon does not point. That is a fade. No trade." : "The close is on the same side the ribbon points.",

  function skillMeter(logs, id, bit) {

    var ok = 0;
    for (var i = 0; i < recent.length; i++) if (recent[i].correct) ok += 1;
    var a = acc(ok, recent.length);
    var today = todayStamp();

      var n = 0;
      for (var j = 0; j < save.logs.length; j++) if (skillOfLog(save.logs[j]) === def.id) n += 1;

    return skills;
  }

  function emptySave() {

      v: 1,
      logs: [],
      charts: [],
      misses: [],
      seen: [],
      shown: [],

      lastResult: {},
      streak: 0,
      bestStreak: 0,
      points: 0,
      skills: {},
      session: null

  }

  function rebuildSpacing(s) {

    s.shown = shown;
    var lastSeen = s.lastSeen && typeof s.lastSeen === "object" ? s.lastSeen : {};

    s.lastSeen = lastSeen;
    var lastResult = s.lastResult && typeof s.lastResult === "object" ? s.lastResult : {};

    return s;
  }

  function parseSave(raw) {

      if (p.v != null && p.v !== 1 && p.v !== 2) return emptySave();
      return rebuildSpacing({
        v: 1,
        logs: p.logs || [],
        charts: p.charts || [],
        misses: p.misses || [],
        seen: Array.isArray(p.seen) ? p.seen : [],
        shown: Array.isArray(p.shown) ? p.shown : [],
        lastSeen: p.lastSeen && typeof p.lastSeen === "object" ? p.lastSeen : {},
        lastResult: p.lastResult && typeof p.lastResult === "object" ? p.lastResult : {},
        streak: Number(p.streak) || 0,
        bestStreak: Number(p.bestStreak) || 0,
        points: Number(p.points) || 0,
        skills: p.skills && typeof p.skills === "object" ? p.skills : {},
        session: p.session && typeof p.session === "object" ? p.session : null

    } catch (e) {
      return emptySave();
    }
  }

    } catch (e) {
      return emptySave();
    }
  }

    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return true;
    } catch (e) {
      return false;
    }
  }

    } catch (e) {}
  }

    var fan = Math.abs(b.e8 - b.e34) / atr;
    var near = function (level) { return Math.abs(b.c - level) / atr; };
    var lv = s.levels;
    var score = 0;
    if (fan < 0.12) score += 2;
    else if (fan < 0.18) score += 1;
    if (near(lv.pTrig) < 0.08 || near(lv.mTrig) < 0.08) score += 2;
    if (near(lv.p382) < 0.1 || near(lv.m382) < 0.1) score += 1;
    if (near(lv.p618) < 0.12 || near(lv.m618) < 0.12) score += 2;
    return score;
  }

  function skillPool(all, skill, similar) {
    var out = [];
    for (var i = 0; i < all.length; i++) {
      var s = all[i];
      if (similar === true) {
        if (skillMatches(s, skill, true)) out.push(s);
      } else if (similar === false) {
        if (skillMatches(s, skill, false)) out.push(s);
      } else if (skillMatches(s, skill, true) || skillMatches(s, skill, false)) {
        out.push(s);
      }

    return out;
  }

  function recencyAgo(id) {

  function isUnseen(id) {
    return !save.lastSeen || save.lastSeen[id] === undefined;

  function spacingOk(id, relax) {
    var ago = recencyAgo(id);
    if (ago >= 1e8) return true;
    if (relax < 2 && ago < RECENT_WINDOW) return false;

    if (res && relax < 1) {
      var gap = res.ok ? OK_GAP : MISS_GAP;

      if (ago < Math.max(gap, res.ok ? OK_GAP : 0)) return false;
    }
    return true;
  }

  function sortCandidates(xs, hard) {
    return xs.slice().sort(function (a, b) {

      var ub = isUnseen(b.id) ? 0 : 1;
      if (ua !== ub) return ua - ub;
      var ga = recencyAgo(a.id);
      var gb = recencyAgo(b.id);
      if (gb !== ga) return gb - ga;
      if (hard) {
        var da = difficultyOf(a);
        var db = difficultyOf(b);
        if (db !== da) return db - da;

    });
  }

  function pickCharts(all, skill, exclude, n, similarFirst, hard) {
    var blocked = {};
    (exclude || []).forEach(function (id) { blocked[id] = true; });
    function gather(similar, relax) {
      var pool = skillPool(all, skill, similar);
      var ok = [];
      for (var i = 0; i < pool.length; i++) {
        var s = pool[i];
        if (blocked[s.id]) continue;
        if (!spacingOk(s.id, relax)) continue;
        ok.push(s);

      return sortCandidates(ok, hard);
    }
    var out = [];

      var relax;
      for (relax = 0; relax <= 2 && want > 0; relax++) {
        var xs = gather(similar, relax);
        for (var i = 0; i < xs.length && want > 0; i++) {
          if (blocked[xs[i].id]) continue;
          out.push(xs[i]);
          blocked[xs[i].id] = true;
          want--;
        }
      }
    }
    if (similarFirst) {
      takeFrom(true, Math.min(3, n));
      takeFrom(false, n - out.length);
    } else {
      takeFrom(true, n);
      if (out.length < n) takeFrom(false, n - out.length);
    }
    if (out.length < n) {
      var rest = sortCandidates(all.filter(function (s) { return !blocked[s.id]; }), hard);
      for (var k = 0; k < rest.length && out.length < n; k++) {
        out.push(rest[k]);

      }
    }

  function skillStats(sv, id) {
    var n = 0, ok = 0;
    for (var i = 0; i < sv.logs.length; i++) {
      if (skillOfLog(sv.logs[i]) === id) {
        n += 1;
        if (sv.logs[i].correct) ok += 1;
      }
    }
    var lvl = skillMeter(sv.logs, id, sv.skills && sv.skills[id]);
    return { id: id, n: n, ok: ok, lvl: lvl, rank: meterRank(lvl) };

  function chooseSkill(sv) {
    var stats = SKILL_DEFS.map(function (d) { return skillStats(sv, d.id); });
    var weak = stats.filter(function (s) { return s.lvl !== "mastered"; });
    var mastered = stats.filter(function (s) { return s.lvl === "mastered"; });
    weak.sort(function (a, b) { return a.rank - b.rank || a.n - b.n; });
    var nShown = (sv.shown || []).length;
    if (!weak.length) {
      var i = nShown % stats.length;
      return { skill: stats[i].id, hard: true, speed: true };
    }
    /* Mastered skills show up much less often — about one review in seven charts. */
    if (mastered.length && nShown && nShown % 7 === 6) {
      mastered.sort(function (a, b) { return a.n - b.n; });
      return { skill: mastered[0].id, hard: true, speed: true };
    }

      hard: pick.lvl === "solid" || pick.lvl === "mastered",

  function byId(all, id) {

  function drawChart(scenario, shown, highlight, compact) {
    var W = 800, H = compact ? 230 : 520;
    var padL = 58, padR = 86, padT = 18, padB = 32;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var bars = scenario.bars.slice(0, Math.max(1, Math.min(shown, BAR_N)));
    var lv = scenario.levels;
    var levelList = [
      { y: lv.p100, name: "+1 ATR" },
      { y: lv.p786, name: "+78.6" },
      { y: lv.p618, name: "+61.8" },
      { y: lv.p50, name: "+50" },
      { y: lv.p382, name: "+38.2" },
      { y: lv.pTrig, name: "+Trig", fence: true },
      { y: lv.pdc, name: "PDC", solid: true },
      { y: lv.mTrig, name: "−Trig", fence: true },
      { y: lv.m382, name: "−38.2" },
      { y: lv.m50, name: "−50" },
      { y: lv.m618, name: "−61.8" },
      { y: lv.m786, name: "−78.6" },
      { y: lv.m100, name: "−1 ATR" }
    ];
    var lo = Math.min.apply(null, bars.map(function (b) { return b.l; }));
    var hi = Math.max.apply(null, bars.map(function (b) { return b.h; }));

    lo -= padPx; hi += padPx;
    var near = levelList.filter(function (L) { return L.y >= lo - lv.atr * 0.35 && L.y <= hi + lv.atr * 0.35; });
    if (near.length) {
      lo = Math.min(lo, Math.min.apply(null, near.map(function (L) { return L.y; })));
      hi = Math.max(hi, Math.max.apply(null, near.map(function (L) { return L.y; })));
    }
    if (hi <= lo) hi = lo + 1;
    function yAt(p) { return padT + ((hi - p) / (hi - lo)) * plotH; }
    var slot = plotW / BAR_N;
    var bodyW = Math.max(5, slot * 0.72);
    function xAt(i) { return padL + slot * (i + 0.5); }
    var visibleLevels = levelList.filter(function (L) { return L.y >= lo && L.y <= hi; });

    for (var t = 0; t < 5; t++) ticks.push(hi - ((hi - lo) * t) / 4);

    }
    var decX = padL + slot * N_VIS;
    var glow = highlight === "ribbon";

    var gateOn = highlight === "gate";
    var yTopFence = yAt(Math.min(hi, Math.max(lo, lv.pTrig)));
    var yBotFence = yAt(Math.min(hi, Math.max(lo, lv.mTrig)));
    var parts = [];
    parts.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="15-minute candlestick chart with ATR levels and pivot ribbon">');
    parts.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#0e1116"/>');
    if (fenceOn) {
      parts.push('<rect x="' + padL + '" y="' + Math.min(yTopFence, yBotFence) + '" width="' + plotW + '" height="' + Math.max(8, Math.abs(yBotFence - yTopFence)) + '" fill="rgba(88,166,255,0.12)"/>');
    }
    visibleLevels.forEach(function (L) {
      var strong = L.solid || (fenceOn && L.fence) || (gateOn && L.name.indexOf("38.2") >= 0);
      var stroke = L.solid ? "#6e7681" : fenceOn && L.fence ? "#58a6ff" : "#30363d";
      parts.push('<line x1="' + padL + '" x2="' + (padL + plotW) + '" y1="' + yAt(L.y) + '" y2="' + yAt(L.y) + '" stroke="' + stroke + '" stroke-width="' + (strong ? 2 : 1) + '"' + (L.solid ? "" : ' stroke-dasharray="5 4"') + '/>');
      parts.push('<text x="' + (padL + plotW + 6) + '" y="' + (yAt(L.y) + 3) + '" fill="#8b949e" font-size="11" font-family="system-ui,sans-serif">' + esc(L.name) + "</text>");
    });
    ticks.forEach(function (tv) {
      parts.push('<text x="' + (padL - 6) + '" y="' + (yAt(tv) + 3) + '" text-anchor="end" fill="#8b949e" font-size="11" font-family="system-ui,sans-serif">' + esc(fmt(tv)) + "</text>");
    });
    parts.push('<line x1="' + decX + '" x2="' + decX + '" y1="' + padT + '" y2="' + (padT + plotH) + '" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="3 3"/>');
    if (glow) {

    }
    parts.push('<polyline points="' + poly("e34") + '" fill="none" stroke="#58a6ff" stroke-width="' + (glow ? 3.2 : 1.6) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    parts.push('<polyline points="' + poly("e21") + '" fill="none" stroke="#3fb950" stroke-width="' + (glow ? 3.4 : 1.8) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    parts.push('<polyline points="' + poly("e8") + '" fill="none" stroke="#56d364" stroke-width="' + (glow ? 4 : 2.2) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    bars.forEach(function (b, i) {
      var up = b.c >= b.o;
      var stroke = up ? "#3fb950" : "#f85149";
      var fill = up ? "#16351f" : "#3d1618";
      var x = xAt(i);
      var yTop = yAt(Math.max(b.o, b.c));
      var yBot = yAt(Math.min(b.o, b.c));
      var bh = Math.max(1.6, yBot - yTop);
      var isDec = i === N_VIS - 1;
      var isFc = scenario.fc === i && (gateOn || fenceOn);
      var isTg = scenario.tg === i && gateOn;
      if (isFc || isTg || isDec) {
        parts.push('<rect x="' + (x - bodyW) + '" y="' + padT + '" width="' + (bodyW * 2) + '" height="' + plotH + '" fill="' + (isTg || isFc ? "rgba(210,153,34,0.16)" : "rgba(110,118,129,0.12)") + '"/>');
      }
      parts.push('<line x1="' + x + '" x2="' + x + '" y1="' + yAt(b.h) + '" y2="' + yAt(b.l) + '" stroke="' + stroke + '" stroke-width="' + (isDec || isFc ? 2.4 : 1.5) + '"/>');
      parts.push('<rect x="' + (x - bodyW / 2) + '" y="' + yTop + '" width="' + bodyW + '" height="' + bh + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (isDec || isFc ? 2 : 1.2) + '"/>');
      if (isTg) {
        var cy = yAt(scenario.code === "SG" || scenario.q1 === "R" ? b.l : b.h);
        parts.push('<circle cx="' + x + '" cy="' + cy + '" r="6" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>');
      }
    });
    parts.push('<text x="' + (decX - 4) + '" y="' + (padT + plotH + 20) + '" text-anchor="end" fill="#8b949e" font-size="11" font-family="system-ui,sans-serif">Decision</text>');
    parts.push("</svg>");
    return parts.join("");
  }

  /* ---------- app state ---------- */
  var ALL = loadScenarios(window.SATY_PACK);
  var save = loadSave();
  var ui = {
    view: "play", /* play | learn */
    phase: "ask", /* ask | feedback | lesson */
    skill: "fresh-pull",
    focus: false,
    hard: false,
    speed: false,
    timeout: false,
    shareNote: "",
    ids: [],
    index: 0,
    qIndex: 0,
    setLogs: [],
    round: [],
    picked: null,
    ok: false,
    lessonSkill: null,
    startMs: Date.now(),
    speedLeft: 0
  };
  var autoTimer = null;
  var speedTimer = null;

  function clearAuto() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  }

  function clearSpeed() {
    if (speedTimer) { clearInterval(speedTimer); speedTimer = null; }
  }

  function markShown(id) {
    if (!id) return;
    save.shown = (save.shown || []).concat([id]);
    if (!save.lastSeen) save.lastSeen = {};
    save.lastSeen[id] = save.shown.length - 1;
  }

  function markResult(id, allOk) {
    if (!id) return;
    if (!save.lastResult) save.lastResult = {};
    save.lastResult[id] = { ok: !!allOk, at: (save.shown || []).length };
  }

  function current() {
    return byId(ALL, ui.ids[ui.index]) || null;
  }

  function questions() {
    var s = current();
    if (!s) return ["qlook"];
    if (ui.focus && ui.skill) return [skillQid(ui.skill)];
    return guidedQueueFor(s, save.logs);
  }

  function qidNow() {
    var qs = questions();
    return qs[Math.min(ui.qIndex, Math.max(0, qs.length - 1))] || "qlook";
  }

  function snapshot() {
    save.session = {
      view: ui.view,
      phase: ui.phase,
      skill: ui.skill,
      focus: ui.focus,
      hard: ui.hard === true,
      speed: ui.speed === true,
      ids: ui.ids,
      index: ui.index,
      qIndex: ui.qIndex,
      setLogs: ui.setLogs,
      round: ui.round,
      picked: ui.picked,
      ok: ui.ok,
      lessonSkill: ui.lessonSkill,
      timeout: ui.timeout === true
    };
    writeSave(save);
  }

  function restoreSession() {
    var ses = save.session;
    if (!ses || !Array.isArray(ses.ids) || !ses.ids.length) return false;
    var ids = ses.ids.filter(function (id) { return !!byId(ALL, id); });
    if (!ids.length) return false;
    ui.view = ses.view === "learn" ? "learn" : "play";
    ui.phase = ses.phase === "feedback" || ses.phase === "lesson" || ses.phase === "ask" ? ses.phase : "ask";
    ui.skill = ses.skill || chooseSkill(save).skill;
    ui.focus = ses.focus === true;
    ui.hard = ses.hard === true;
    ui.speed = ses.speed === true;
    ui.timeout = ses.timeout === true;
    ui.ids = ids;
    ui.index = Math.max(0, Math.min(ses.index || 0, ids.length - 1));
    ui.qIndex = Math.max(0, ses.qIndex || 0);
    ui.setLogs = Array.isArray(ses.setLogs) ? ses.setLogs : [];
    ui.round = Array.isArray(ses.round) ? ses.round : [];
    ui.picked = ses.picked || null;
    ui.ok = ses.ok === true;
    ui.lessonSkill = ses.lessonSkill || null;
    ui.startMs = Date.now();
    if (ui.phase === "feedback" && ui.ok) {
      autoTimer = setTimeout(function () {
        autoTimer = null;
        afterCorrect();
      }, AUTO_OK_MS);
    } else if (ui.phase === "ask") {
      startSpeedClock();
    }
    return true;
  }

  function startPlay(focus, skill, seed, opts) {
    opts = opts || {};
    ui.skill = skill || chooseSkill(save).skill;
    ui.focus = !!focus;
    ui.hard = !focus && !!opts.hard;
    ui.speed = !focus && !!opts.speed;
    ui.timeout = false;
    var exclude = [];
    if (seed) exclude.push(seed.id);
    var n = focus ? 5 : 1;
    var charts = pickCharts(ALL, ui.skill, exclude, n, !!focus, ui.hard);
    if (!charts.length) charts = ALL.slice(0, n);
    ui.ids = charts.map(function (s) { return s.id; });
    ui.index = 0;
    ui.qIndex = 0;
    ui.setLogs = [];
    ui.round = [];
    ui.picked = null;
    ui.ok = false;
    ui.phase = "ask";
    ui.view = "play";
    ui.lessonSkill = null;
    ui.startMs = Date.now();
    if (ui.ids[0]) markShown(ui.ids[0]);
    snapshot();
  }

  function nextFreshChart() {
    var choice = chooseSkill(save);
    startPlay(false, choice.skill, current(), { hard: choice.hard, speed: choice.speed });
  }

  function begin() {
    requestPersist();
    if (restoreSession()) return;
    var choice = chooseSkill(save);
    startPlay(false, choice.skill, null, { hard: choice.hard, speed: choice.speed });
  }

  function startSpeedClock() {
    clearSpeed();
    ui.speedLeft = 0;
    if (!ui.speed || ui.phase !== "ask" || ui.view !== "play") return;
    ui.speedLeft = Math.round(SPEED_MS / 1000);
    speedTimer = setInterval(function () {
      ui.speedLeft -= 1;
      if (ui.speedLeft <= 0) {
        clearSpeed();
        onTimeout();
        return;
      }
      var node = el("timer");
      if (node) {
        node.textContent = ui.speedLeft + "s";
        node.className = "timer" + (ui.speedLeft <= 3 ? " warn" : "");
      }
    }, 1000);
  }

  function recordAnswer(ans, timedOut) {
    var s = current();
    if (!s) return;
    var q = qidNow();
    var want = truthOf(s, q);
    var timeout = !!timedOut || ans == null;
    var got = timeout ? "" : ans;
    var correct = !timeout && got === want;
    var ms = Math.min(120000, Math.max(0, Date.now() - ui.startMs));
    var log = { id: s.id, q: q, correct: correct, ms: ms, tag: s.tag, code: s.code, timeout: timeout };
    ui.picked = timeout ? null : got;
    ui.ok = correct;
    ui.timeout = timeout;
    ui.round = ui.round.concat([log]);
    save.logs = save.logs.concat([log]);
    if (!correct && !timeout) {
      save.misses = save.misses.concat([{ id: s.id, q: q, got: got, want: want, tag: s.tag }]);
    }
    var sk = skillOfLog(log);
    if (sk) save.skills = touchSkill(save, sk, correct);
    save.points += correct ? 3 : 0;
    if (correct) {
      ui.phase = "feedback";
    } else {
      ui.lessonSkill = sk || ui.skill;
      ui.phase = "lesson";
    }
    snapshot();
  }

  function onTimeout() {
    if (ui.phase !== "ask") return;
    recordAnswer(null, true);
    render();
  }

  function closeChartAndAdvance() {
    var s = current();
    if (s) {
      var main = ui.round.filter(function (l) { return l.q !== "win"; });
      var allOk = main.length > 0 && main.every(function (l) { return l.correct; });
      var ms = main.reduce(function (sum, l) { return sum + l.ms; }, 0);
      save.charts = save.charts.concat([{ id: s.id, allOk: allOk, ms: ms }]);
      save.streak = allOk ? save.streak + 1 : 0;
      save.bestStreak = Math.max(save.bestStreak, save.streak);
      if (save.seen.indexOf(s.id) < 0) save.seen = save.seen.concat([s.id]);
      markResult(s.id, allOk);
      ui.setLogs = ui.setLogs.concat([{ id: s.id, allOk: allOk }]);
    }
    ui.round = [];
    ui.picked = null;
    ui.ok = false;
    ui.qIndex = 0;
    ui.lessonSkill = null;

    if (ui.focus) {
      var okN = ui.setLogs.filter(function (c) { return c.allOk; }).length;
      if (ui.index + 1 >= ui.ids.length) {
        if (okN >= 4) {
          ui.focus = false;
          startPlay(false, lowestSkill(save), s);
          render();
          return;
        }
        startPlay(true, ui.skill, s);
        render();
        return;
      }
      ui.index += 1;
      ui.phase = "ask";
      ui.timeout = false;
      ui.startMs = Date.now();
      if (ui.ids[ui.index]) markShown(ui.ids[ui.index]);
      snapshot();
      render();
      return;
    }

    /* normal play: one chart at a time, always the weakest skill */
    nextFreshChart();
    render();
  }

  function afterCorrect() {
    var qs = questions();
    if (ui.qIndex + 1 < qs.length) {
      ui.qIndex += 1;
      ui.picked = null;
      ui.ok = false;
      ui.timeout = false;
      ui.phase = "ask";
      ui.startMs = Date.now();
      snapshot();
      render();
      return;
    }
    closeChartAndAdvance();
  }

  function onGotIt() {
    /* After a miss: if not already in focus, enter a 5-chart focus set on that skill. */
    var s = current();
    var sk = ui.lessonSkill || (s ? skillOfLog({ q: qidNow(), tag: s.tag }) : null) || lowestSkill(save);
    if (!ui.focus) {
      var main = ui.round.filter(function (l) { return l.q !== "win"; });
      var allOk = false;
      var ms = main.reduce(function (sum, l) { return sum + l.ms; }, 0);
      if (s) {
        save.charts = save.charts.concat([{ id: s.id, allOk: allOk, ms: ms }]);
        save.streak = 0;
        if (save.seen.indexOf(s.id) < 0) save.seen = save.seen.concat([s.id]);
        markResult(s.id, allOk);
      }
      startPlay(true, sk, s);
      render();
      return;
    }
    /* already in focus: finish this chart and continue the set */
    closeChartAndAdvance();
  }

  function onPick(v) {
    if (ui.phase !== "ask") return;
    clearAuto();
    clearSpeed();
    recordAnswer(v, false);
    render();
    if (ui.ok) {
      autoTimer = setTimeout(function () {
        autoTimer = null;
        afterCorrect();
      }, AUTO_OK_MS);
    }
  }

  /* ---------- progress share ---------- */
  function median(xs) {
    if (!xs.length) return null;
    var a = xs.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  function pct(ok, n) {
    if (!n) return "—";
    return Math.round((100 * ok) / n) + "%";
  }

  function fmtSecs(ms) {
    if (ms == null || !isFinite(ms)) return "—";
    return (ms / 1000).toFixed(1) + "s";
  }

  function progressText() {
    var logs = save.logs || [];
    var n = logs.length;
    var ok = 0;
    var times = [];
    for (var i = 0; i < logs.length; i++) {
      if (logs[i].correct) ok += 1;
      if (!logs[i].timeout) times.push(logs[i].ms || 0);
    }
    var last = logs.slice(-50);
    var lastOk = 0;
    for (var j = 0; j < last.length; j++) if (last[j].correct) lastOk += 1;
    var unique = {};
    (save.shown || save.seen || []).forEach(function (id) { unique[id] = true; });
    var seenN = Object.keys(unique).length;

    var lines = [];
    lines.push("Saty Spotter progress");
    lines.push("Answered " + n + "  ·  overall " + pct(ok, n) + (last.length ? "  ·  last " + last.length + ": " + pct(lastOk, last.length) : ""));
    lines.push("Charts seen " + seenN + " of " + ALL.length);
    lines.push("Median time " + fmtSecs(median(times)) + "  ·  streak " + (save.streak || 0) + " (best " + (save.bestStreak || 0) + ")");
    lines.push("");
    lines.push("Skills");
    SKILL_DEFS.forEach(function (def) {
      var st = skillStats(save, def.id);
      var bit = (save.skills && save.skills[def.id]) || null;
      var lvl = skillMeter(save.logs, def.id, bit);
      lines.push("• " + def.label + " — " + lvl + ", " + pct(st.ok, st.n) + (st.n ? " (" + st.n + ")" : " (none yet)"));
    });

    var conf = {};
    (save.misses || []).forEach(function (m) {
      if (!m || !m.q) return;
      var key = m.q + "\t" + (m.want || "") + "\t" + (m.got || "");
      conf[key] = (conf[key] || 0) + 1;
    });
    var confList = Object.keys(conf).map(function (k) {
      var p = k.split("\t");
      return { q: p[0], want: p[1], got: p[2], n: conf[k] };
    }).sort(function (a, b) { return b.n - a.n; }).slice(0, 5);
    lines.push("");
    if (confList.length) {
      lines.push("Most common misses");
      confList.forEach(function (c) {
        var sid = skillOfLog({ q: c.q, tag: c.q === "q2f" && c.want === "X" ? "ex" : "" });
        var skill = sid ? skillLabel(sid) : c.q;
        lines.push("• " + skill + ": picked “" + labelOf(c.q, c.got) + "” when it was “" + labelOf(c.q, c.want) + "” (" + c.n + ")");
      });
    } else {
      lines.push("Most common misses: none yet");
    }
    return lines.join("\n");
  }

  function setShareNote(msg) {
    ui.shareNote = msg || "";
    var node = el("share-note");
    if (node) node.textContent = ui.shareNote;
    else if (msg) render();
  }

  function sendProgress() {
    var text = progressText();
    function copied() { setShareNote("Copied — paste it into chat."); }
    function fallbackTextarea() {
      try {
        var ok = window.prompt("Copy your progress and paste it into chat:", text);
        if (ok !== null) setShareNote("Copy the text and paste it into chat.");
      } catch (e2) {
        setShareNote("Could not share from this browser.");
      }
    }
    try {
      if (navigator.share) {
        navigator.share({ title: "Saty Spotter progress", text: text }).then(function () {
          setShareNote("Shared.");
        }).catch(function (err) {
          if (err && err.name === "AbortError") return;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(copied).catch(fallbackTextarea);
          } else fallbackTextarea();
        });
        return;
      }
    } catch (e) {}
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(copied).catch(fallbackTextarea);
        return;
      }
    } catch (e3) {}
    fallbackTextarea();
  }

  /* ---------- render ---------- */
  function el(id) { return document.getElementById(id); }


  function renderChart(s, highlight, compact) {
    if (!s) return "";
    var shown = N_VIS;
    return (
      '<div class="chart">' +
        drawChart(s, shown, highlight, compact) +
        '<div class="caption">' + esc(s.name) + " · " + esc(s.when) + " · PDC " + esc(fmt(s.levels.pdc)) + " · ATR " + esc(fmt(s.levels.atr)) + "</div>" +
      "</div>"
    );
  }

  function renderButtons(q) {
    var opts = optsOf(q);
    return opts.map(function (o) {
      var tone = optionTone(q, o.v);
      return '<button type="button" class="opt tone-' + tone + '" data-v="' + esc(o.v) + '">' + esc(o.l) + "</button>";
    }).join("");
  }

  function renderLearn() {
    var tr = ALL.filter(function (s) { return s.tag === "tr" && s.q1 === "G"; })[0];
    var gg = ALL.filter(function (s) { return s.tag === "gg" && s.q1 === "G"; })[0];
    var st = ALL.filter(function (s) { return s.tag === "st"; })[0];
    var ex = ALL.filter(function (s) { return s.tag === "ex"; })[0];
    var html = '<div class="learn">';
    html += "<h2>The checklist</h2>";
    html += "<ol class='rules'>";
    html += "<li><strong>Ribbon.</strong> Green and fanned up, or red and fanned down. Twisted or flat means stay out.</li>";
    html += "<li><strong>What are you looking at?</strong> Fresh break, pullback after a break, or neither.</li>";
    html += "<li><strong>Fresh break</strong> is a Trigger only on the first 15-minute close through the trigger, with the ribbon agreeing, and not already at 61.8. Target 38.2.</li>";
    html += "<li><strong>Pullback</strong> is a Golden Gate only if price tagged 38.2, pulled back to the 8 EMA, and held, still beyond the trigger. Target 61.8.</li>";
    html += "<li><strong>Neither</strong> is no trade. Stale is an old break with no 38.2 pullback setup. Extended is already at 61.8 — too late, and not the same as stale.</li>";
    html += "</ol>";
    if (tr && gg) {
      html += "<h3>Fresh break vs pullback</h3>";
      html += '<div class="pair"><div><div class="pair-label">Trigger — first close</div>' + drawChart(tr, N_VIS, "fence", true) + "</div>";
      html += '<div><div class="pair-label">Golden Gate — 38.2, then the 8</div>' + drawChart(gg, N_VIS, "gate", true) + "</div></div>";
    }
    if (st && ex) {
      html += "<h3>Stale vs extended</h3>";
      html += '<div class="pair"><div><div class="pair-label">Stale — old break, no setup</div>' + drawChart(st, N_VIS, "fence", true) + "</div>";
      html += '<div><div class="pair-label">Extended — already at 61.8</div>' + drawChart(ex, N_VIS, "fence", true) + "</div></div>";
    }
    html += '<button type="button" class="opt tone-none" id="learn-back">Back to practice</button>';
    html += "</div>";
    return html;
  }

  function render() {
    var root = el("app");
    var skill = ui.skill || lowestSkill(save);
    var meter = skillMeter(save.logs, skill, save.skills && save.skills[skill]);
    var header =
      '<header class="top">' +
        '<div class="brand">Saty Spotter</div>' +
        '<div class="top-links">' +
          '<button type="button" class="learn-link" id="btn-learn">Learn</button>' +
          '<button type="button" class="learn-link" id="btn-share">Send my progress</button>' +
        "</div>" +
      "</header>" +
      '<div class="share-note" id="share-note">' + (ui.shareNote ? esc(ui.shareNote) : "") + "</div>" +
      '<div class="strip" id="strip">You\'re working on: ' + esc(skillLabel(skill)) + " · " + esc(meter) +
        (ui.focus ? " · focus " + ui.setLogs.filter(function (c) { return c.allOk; }).length + "/" + ui.setLogs.length : "") +
        (ui.speed && ui.phase === "ask" ? ' · <span class="timer' + (ui.speedLeft && ui.speedLeft <= 3 ? " warn" : "") + '" id="timer">' + (ui.speedLeft || 8) + "s</span>" : "") +
      "</div>";

    if (ui.view === "learn") {
      root.innerHTML = header + renderLearn();
      bind();
      return;
    }

    var s = current();
    if (!s) {
      root.innerHTML = header + "<p class='prompt'>No charts loaded.</p>";
      bind();
      return;
    }
    var q = qidNow();
    var hl = ui.phase === "lesson" && ui.lessonSkill ? skillHighlight(ui.lessonSkill) : highlightFor(q);
    var body = renderChart(s, hl, false);

    if (ui.phase === "ask") {
      body += '<p class="prompt">' + esc(promptOf(q)) + "</p>";
      body += '<div class="opts" id="opts">' + renderButtons(q) + "</div>";
    } else if (ui.phase === "feedback") {
      body += '<div class="verdict ok">Yes — ' + esc(labelOf(q, truthOf(s, q))) + "</div>";
    } else if (ui.phase === "lesson") {
      var lines = lessonLines(s, ui.lessonSkill || skill);
      body += '<div class="verdict bad">' + (ui.timeout ? "Time's up. The answer is " : "Not quite. The answer is ") + esc(labelOf(q, truthOf(s, q))) + ".</div>";
      body += '<div class="lesson">';
      lines.forEach(function (line) { body += "<p>" + esc(line) + "</p>"; });
      if (TAG_WHY[s.tag]) body += "<p>" + esc(TAG_WHY[s.tag]) + "</p>";
      body += '<button type="button" class="opt tone-none" id="got-it">Got it</button>';
      body += "</div>";
    }

    root.innerHTML = header + '<div class="stage">' + body + "</div>";
    bind();
    if (ui.view === "play" && ui.phase === "ask" && ui.speed && !speedTimer) startSpeedClock();
  }

  function bind() {
    var learn = el("btn-learn");
    if (learn) learn.onclick = function () {
      clearAuto();
      clearSpeed();
      ui.view = "learn";
      snapshot();
      render();
    };
    var share = el("btn-share");
    if (share) share.onclick = function () { sendProgress(); };
    var back = el("learn-back");
    if (back) back.onclick = function () {
      ui.view = "play";
      snapshot();
      render();
    };
    var opts = el("opts");
    if (opts) {
      var btns = opts.querySelectorAll("button[data-v]");
      for (var i = 0; i < btns.length; i++) {
        btns[i].onclick = (function (v) { return function () { onPick(v); }; })(btns[i].getAttribute("data-v"));
      }
    }
    var got = el("got-it");
    if (got) got.onclick = function () { onGotIt(); };
  }

  window.__spotter = {
    getSave: function () { return save; },
    getUi: function () { return ui; },
    current: current,
    qid: qidNow,
    all: ALL,
    key: STORAGE_KEY,
    pick: onPick,
    gotIt: onGotIt,
    want: function () { var s = current(); return s ? truthOf(s, qidNow()) : null; },
    progressText: progressText,
    step: function (v) {
      onPick(v);
      clearAuto();
      if (ui.ok) afterCorrect();
      else onGotIt();
    },
    pools: function () {
      var out = {};
      SKILL_DEFS.forEach(function (d) {
        out[d.id] = {
          similar: skillPool(ALL, d.id, true).length,
          contrast: skillPool(ALL, d.id, false).length
        };
      });
      return out;
    }
  };

  begin();
  render();
})();

  </script>
</body>
</html>
