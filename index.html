      if (a && b && lookWant(a) === "B" && lookWant(b) === "P") { pairFresh = a; pairPull = b; }
    });
    if (pairFresh && pairPull) {
      html += "<h3>Same day: fresh break, then pullback</h3>";
      html += '<div class="pair"><div><div class="pair-label">Fresh — first close in the last 2 bars</div>' + drawChart(pairFresh, N_VIS, "look", true) + "</div>";
      html += '<div><div class="pair-label">Later — tagged Golden Gate 38.2, pulling back to the ribbon</div>' + drawChart(pairPull, N_VIS, "look", true) + "</div></div>";
    } else if (tr && gg) {
      html += "<h3>Fresh break vs pullback</h3>";
      html += '<div class="pair"><div><div class="pair-label">Trigger — first close</div>' + drawChart(tr, N_VIS, "look", true) + "</div>";
      html += '<div><div class="pair-label">Golden Gate — 38.2, then a ribbon pullback</div>' + drawChart(gg, N_VIS, "look", true) + "</div></div>";
    }
    if (st && ex) {
      html += "<h3>Stale vs full range</h3>";
      html += '<div class="pair"><div class="pair-label">Stale — old break, no setup</div>' + drawChart(st, N_VIS, "fence", true) + "</div>";
      html += '<div><div class="pair-label">Extended — already at 1 ATR (full range)</div>' + drawChart(ex, N_VIS, "fence", true) + "</div></div>";
    }
    html += '<button type="button" class="opt tone-none" id="learn-back">Back to practice</button>';
    html += "</div>";
    return html;
  }

  function render() {
    var root = el("app");
    var skill = ui.skill || lowestSkill(save);
    var meter = skillMeter(save.logs, skill, save.skills && save.skills[skill]);
    var header =
      '<header class="top">' +
        '<div class="brand">Saty Spotter</div>' +
        '<div class="top-links">' +
          '<button type="button" class="learn-link" id="btn-learn">Learn</button>' +
          '<button type="button" class="learn-link" id="btn-trade">Trade it</button>' +
          '<button type="button" class="learn-link" id="btn-exam">Answer key</button>' +
          '<button type="button" class="learn-link" id="btn-share">Send my progress</button>' +
        "</div>" +
      "</header>" +
      '<div class="share-note" id="share-note">' + (ui.shareNote ? esc(ui.shareNote) : "") + "</div>" +
      '<div class="strip" id="strip">' + (ui.view === "trade"
        ? "Level 2 · Trade it"
        : ui.view === "learn"
          ? "The rules, in order"
          : ui.view === "exam"
            ? "Saty answer key · scored separately"
          : ("You\'re working on: " + esc(skillLabel(skill)) + " · " + esc(meter) +
            (ui.focus ? " · focus " + ui.setLogs.filter(function (c) { return c.allOk; }).length + "/" + ui.setLogs.length : "") +
            (ui.speed && ui.phase === "ask" ? ' · <span class="timer' + (ui.speedLeft && ui.speedLeft <= 3 ? " warn" : "") + '" id="timer">' + (ui.speedLeft || 8) + "s</span>" : ""))) +
      "</div>";

    if (ui.view === "trade") {
      root.innerHTML = header + renderTrade();
      bind();
      return;
    }

    if (ui.view === "learn") {
      root.innerHTML = header + renderLearn();
      bind();
      return;
    }

    if (ui.view === "exam") {
      root.innerHTML = header + renderExam();
      bind();
      return;
    }

    var s = current();
    if (!s) {
      root.innerHTML = header + "<p class='prompt'>No charts loaded.</p>";
      bind();
      return;
    }
    var q = qidNow();
    var lookLesson = ui.phase === "lesson" && (ui.lessonSkill === "fresh-pull" || q === "qlook");
    var ggLesson = ui.phase === "lesson" && (ui.lessonSkill === "gg" || q === "q3");
    var hl = lookLesson ? "look" : (ggLesson ? "look" : (ui.phase === "lesson" && ui.lessonSkill ? skillHighlight(ui.lessonSkill) : highlightFor(q)));
    var body = renderChart(s, hl, false);

    if (ui.phase === "ask") {
      body += '<p class="prompt">' + esc(promptOf(q)) + "</p>";
      body += '<div class="opts" id="opts">' + renderButtons(q) + "</div>";
    } else if (ui.phase === "feedback") {
      body += '<div class="verdict ok">Yes — ' + esc(labelOf(q, truthOf(s, q))) + "</div>";
    } else if (ui.phase === "lesson") {
      var lines = lessonLines(s, ui.lessonSkill || skill);
      body += '<div class="verdict bad">' + (ui.timeout ? "Time's up. The answer is " : "Not quite. The answer is ") + esc(labelOf(q, truthOf(s, q))) + ".</div>";
      body += '<div class="lesson">';
      if (lookLesson) {
        body += '<div class="look-rule">';
        LOOK_RULE.forEach(function (line) { body += "<p>" + esc(line) + "</p>"; });
        body += "</div>";
        body += "<p>" + esc(lookWhy(s)) + "</p>";
        var info = lookRanInfo(s);
        var ranBits = [];
        if (info.ago == null) ranBits.push("First close: not in this window");
        else ranBits.push("First close: " + info.ago + " bar" + (info.ago === 1 ? "" : "s") + " ago");
        if (info.dist != null && isFinite(info.dist)) ranBits.push("Now " + fmtAtrPct(info.dist) + " from the trigger");
        if (atFullRange(s)) ranBits.push("already at 1 ATR (full range)");
        else if (tagged618SinceBreak(s)) ranBits.push("61.8 already tagged — Golden Gate is done (stale), even if price comes back");
        else if (info.at618) ranBits.push("mid-range 61.8 — first target, not too late");
        body += '<div class="ran-cue">' + esc(ranBits.join(" · ")) + "</div>";
        var partner = LOOK_PAIRS[s.id] ? byId(ALL, LOOK_PAIRS[s.id]) : null;
        if (partner) {
          var plabel = lookWant(partner) === "B" ? "Same day, at the first close — a fresh break" : "Same day, after the pullback to the 8";
          body += '<div class="pair-label">' + esc(plabel) + "</div>" + drawChart(partner, N_VIS, "look", true);
        }
        if (!ui.quiz) ui.quiz = "bars";
        body += '<p class="prompt">Quick check: how many bars since the first close past the trigger?</p>';
        if (ui.quiz === "bars") {
          body += '<div class="opts" id="bars-opts">';
          BARS_OPTS.forEach(function (o) {
            body += '<button type="button" class="opt tone-none" data-bars="' + esc(o.v) + '">' + esc(o.l) + "</button>";
          });
          body += "</div>";
        } else if (ui.quiz === "bars-ok") {
          body += '<div class="verdict ok">Yes — ' + esc((BARS_OPTS.filter(function (o) { return o.v === barsSinceTruth(s); })[0] || {}).l || "") + ".</div>";
        } else if (ui.quiz === "bars-bad") {
          body += '<div class="verdict bad">The first close was ' + esc((BARS_OPTS.filter(function (o) { return o.v === barsSinceTruth(s); })[0] || {}).l || "not in this window") + ".</div>";
        }
      } else if (ggLesson) {
        var chk = ggChecks(s);
        body += '<div class="gg-checks">';
        body += '<div class="chk ' + (chk.tagged ? "yes" : "no") + '">' + (chk.tagged ? "✓" : "✗") + " 38.2 tagged</div>";
        body += '<div class="chk ' + (chk.pulled ? "yes" : "no") + '">' + (chk.pulled ? "✓" : "✗") + " Pulled back to the 8 EMA</div>";
        body += '<div class="chk ' + (chk.held ? "yes" : "no") + '">' + (chk.held ? "✓" : "✗") + " Held, still beyond the trigger</div>";
        body += "</div>";
        if (chk.yes) body += "<p>Golden Gate (38.2) is tagged, with a ribbon pullback that held, and 61.8 has not been tagged yet. About a 60% chance of reaching 61.8 (the Golden FIB). Once 61.8 has been tagged, the Golden Gate is done (stale), even if price comes back.</p>";
        else body += "<p>" + esc(lessonLines(s, "gg").join(" ")) + "</p>";
      } else {
        lines.forEach(function (line) { body += "<p>" + esc(line) + "</p>"; });
        if (TAG_WHY[s.tag]) body += "<p>" + esc(TAG_WHY[s.tag]) + "</p>";
      }
      if (!(lookLesson && ui.quiz === "bars")) {
        body += '<button type="button" class="opt tone-none" id="got-it">Got it</button>';
      }
      body += "</div>";
    }

    root.innerHTML = header + '<div class="stage">' + body + "</div>";
    bind();
    if (ui.view === "play" && ui.phase === "ask" && ui.speed && !speedTimer) startSpeedClock();
  }

  function bind() {
    var learn = el("btn-learn");
    if (learn) learn.onclick = function () {
      clearAuto();
      clearSpeed();
      clearL2Timer();
      if (save.l2) save.l2.resume = false;
      ui.view = "learn";
      snapshot();
      render();
    };
    var share = el("btn-share");
    if (share) share.onclick = function () { sendProgress(); };
    var trade = el("btn-trade");
    if (trade) trade.onclick = function () {
      clearAuto();
      clearSpeed();
      l2StartSession(false);
      render();
    };
    hook("btn-exam", function () {
      clearAuto();
      clearSpeed();
      clearL2Timer();
      if (save.l2) save.l2.resume = false;
      startExam(false);
      render();
    });
    hook("btn-notrade", function () {
      clearAuto();
      clearSpeed();
      clearL2Timer();
      if (save.l2) save.l2.resume = false;
      startPlay(true, "no-trade", null, { skillOnly: true, n: 8 });
      render();
    });
    hook("exam-start", function () { startExam(true); render(); });
    hook("exam-next", function () { examNext(); });
    var examOpts = el("exam-opts");
    if (examOpts) {
      var ebtns = examOpts.querySelectorAll("button[data-exam]");
      for (var ei = 0; ei < ebtns.length; ei++) {
        ebtns[ei].onclick = (function (v) { return function () { examPick(v); }; })(ebtns[ei].getAttribute("data-exam"));
      }
    }
    var back = el("learn-back");
    if (back) back.onclick = function () {
      ui.view = "play";
      snapshot();
      render();
    };
    hook("flag-open", function () {
      if (ui.view === "trade") {
        var cur = l2Current();
        if (cur) openFlag(cur.id, "trade");
      } else {
        var sflg = current();
        if (sflg) openFlag(sflg.id, "play");
      }
    });
    hook("flag-save", function () {
      var area = el("flag-note");
      var note = area ? area.value : "";
      saveFlag(ui.flagId, ui.flagView, note);
    });
    var opts = el("opts");
    if (opts) {
      var btns = opts.querySelectorAll("button[data-v]");
      for (var i = 0; i < btns.length; i++) {
        btns[i].onclick = (function (v) { return function () { onPick(v); }; })(btns[i].getAttribute("data-v"));
      }
    }
    var got = el("got-it");
    if (got) got.onclick = function () { onGotIt(); };
    var bars = el("bars-opts");
    if (bars) {
      var bbs = bars.querySelectorAll("button[data-bars]");
      for (var b = 0; b < bbs.length; b++) {
        bbs[b].onclick = (function (v) { return function () { onBarsPick(v); }; })(bbs[b].getAttribute("data-bars"));
      }
    }
    function hook(id, fn) {
      var node = el(id);
      if (node) node.onclick = fn;
    }
    hook("l2-start", function () { l2StartSession(true); render(); });
    hook("l2-back", function () { l2Leave(); });
    hook("l2-next", function () { l2NextBar(); });
    hook("l2-skip", function () { l2JumpToDecide(); });
    hook("l2-L", function () { l2Decide("L"); });
    hook("l2-S", function () { l2Decide("S"); });
    hook("l2-W", function () { l2Decide("W"); });
    hook("l2-N", function () { l2Decide("N"); });
    hook("l2-continue", function () { l2AfterOutcome(); });
    var stops = document.querySelectorAll("[data-l2stop]");
    for (var si = 0; si < stops.length; si++) {
      stops[si].onclick = (function (v) { return function () { l2ChooseStop(v); }; })(stops[si].getAttribute("data-l2stop"));
    }
    var tgts = document.querySelectorAll("[data-l2tgt]");
    for (var ti = 0; ti < tgts.length; ti++) {
      tgts[ti].onclick = (function (v) { return function () { l2ChooseTarget(v); }; })(tgts[ti].getAttribute("data-l2tgt"));
    }
  }

  function onBarsPick(v) {
    var s = current();
    if (!s || ui.quiz !== "bars") return;
    ui.quiz = v === barsSinceTruth(s) ? "bars-ok" : "bars-bad";
    snapshot();
    render();
  }

  window.__spotter = {
    getSave: function () { return save; },
    getUi: function () { return ui; },
    current: current,
    qid: qidNow,
    all: ALL,
    key: STORAGE_KEY,
    pick: onPick,
    gotIt: onGotIt,
    want: function () { var s = current(); return s ? truthOf(s, qidNow()) : null; },
    progressText: progressText,
    lookWant: lookWant,
    skillMeter: function (id) { return skillMeter(save.logs, id, save.skills && save.skills[id]); },
    q1Unlocked: function () { return q1Unlocked(save); },
    barsSince: function () { var s = current(); return s ? barsSinceTruth(s) : null; },
    onBars: onBarsPick,
    getL2: function () { return save.l2; },
    l2Start: function (force) { l2StartSession(!!force); render(); },
    l2Jump: l2JumpToDecide,
    l2Decide: l2Decide,
    l2Stop: l2ChooseStop,
    l2Target: l2ChooseTarget,
    l2Continue: l2AfterOutcome,
    l2Setup: function () { var s = l2Current(); return s ? l2SetupOf(s) : null; },
    l2Current: l2Current,
    noTradeReason: function (s) { s = s || current() || l2Current(); return s ? noTradeReason(s) : null; },
    noTradeDetail: function (s) { s = s || current() || l2Current(); return s ? noTradeDetail(s) : null; },
    first618Tag: first618Tag,
    l2ReasonOf: noTradeReason,
    l2SetupOf: l2SetupOf,
    flags: function () { return save.flags || []; },
    exam: function () { return save.exam; },
    startExam: function (force) { startExam(!!force); render(); },
    examPick: examPick,
    examNext: examNext,
    SATY_EXAM: SATY_EXAM,
    startNoTrade: function () { startPlay(true, "no-trade", null, { skillOnly: true, n: 8 }); render(); },
    step: function (v) {
      onPick(v);
      clearAuto();
      if (ui.ok) afterCorrect();
      else onGotIt();
    },
    pools: function () {
      var out = {};
      SKILL_DEFS.forEach(function (d) {
        out[d.id] = {
          similar: skillPool(ALL, d.id, true).length,
          contrast: skillPool(ALL, d.id, false).length
        };
      });
      return out;
    }
  };

  begin();
  render();
})();
</script>
</body>
</html>
