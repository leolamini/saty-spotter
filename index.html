<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <meta name="apple-mobile-web-app-capable" content="yes">
  <meta name="mobile-web-app-capable" content="yes">
  <meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
  <meta name="apple-mobile-web-app-title" content="Saty Spotter">
  <meta name="theme-color" content="#0e1116">
  <meta name="description" content="A simple drill for Saty trigger and Golden Gate setups. Opens where you left off.">
  <link rel="manifest" href="manifest.webmanifest">
  <link rel="apple-touch-icon" href="apple-touch-icon.png">
  <link rel="icon" type="image/png" sizes="192x192" href="icon-192.png">
  <title>Saty Spotter</title>
  <style>

:root {
  --bg: #0e1116;
  --card: #161b22;
  --text: #e6edf3;
  --muted: #8b949e;
  --line: #30363d;
  --green: #3fb950;
  --green-bg: #16351f;
  --red: #f85149;
  --red-bg: #3d1618;
  --blue: #58a6ff;
  --btn: #21262d;
  --focus: #388bfd;
}
* { box-sizing: border-box; -webkit-tap-highlight-color: transparent; }
html, body {
  margin: 0;
  padding: 0;
  background: var(--bg);
  color: var(--text);
  font-family: system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
  min-height: 100%;
}
body {
  padding: env(safe-area-inset-top) env(safe-area-inset-right) env(safe-area-inset-bottom) env(safe-area-inset-left);
}
#app { max-width: 560px; margin: 0 auto; min-height: 100vh; padding: 8px 14px 24px; }
.top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  gap: 8px;
  padding: 4px 0 2px;
}
.brand {
  font-weight: 700;
  font-size: 15px;
  letter-spacing: 0.01em;
}
.learn-link {
  background: none;
  border: none;
  color: var(--blue);
  font: inherit;
  font-size: 14px;
  font-weight: 600;
  padding: 8px 4px;
  cursor: pointer;
}
.strip {
  font-size: 12px;
  color: var(--muted);
  padding: 2px 0 10px;
  border-bottom: 1px solid var(--line);
  margin-bottom: 10px;
}
.chart svg { display: block; width: 100%; height: auto; max-height: 52vh; touch-action: pan-y; user-select: none; }
.caption { margin: 6px 0 10px; color: var(--muted); font-size: 11px; line-height: 1.35; }
.prompt {
  font-size: 17px;
  font-weight: 600;
  line-height: 1.35;
  margin: 0 0 12px;
}
.opts { display: flex; flex-direction: column; gap: 10px; }
.opt {
  width: 100%;
  min-height: 52px;
  padding: 14px 16px;
  font: inherit;
  font-size: 17px;
  font-weight: 600;
  line-height: 1.25;
  text-align: center;
  border-radius: 12px;
  border: 1px solid var(--line);
  background: var(--btn);
  color: var(--text);
  cursor: pointer;
}
.opt.tone-long { background: var(--green-bg); color: var(--green); border-color: #238636; }
.opt.tone-short { background: var(--red-bg); color: var(--red); border-color: #da3633; }
.opt.tone-skip { background: #21262d; color: var(--muted); }
.opt:active { transform: scale(0.99); }
.verdict {
  padding: 12px 14px;
  border-radius: 12px;
  font-weight: 700;
  font-size: 16px;
  margin: 4px 0 10px;
  border-left: 4px solid;
}
.verdict.ok { background: var(--green-bg); color: var(--green); border-color: var(--green); }
.verdict.bad { background: var(--red-bg); color: #ff7b72; border-color: var(--red); }
.lesson p { margin: 0 0 10px; font-size: 15px; line-height: 1.45; color: var(--text); }
.learn h2, .learn h3 { margin: 16px 0 8px; font-size: 18px; }
.learn .rules { margin: 0; padding-left: 20px; }
.learn .rules li { margin: 0 0 10px; font-size: 15px; line-height: 1.45; }
.pair { display: flex; flex-direction: column; gap: 14px; margin: 8px 0 16px; }
.pair-label { font-size: 13px; font-weight: 700; color: var(--muted); margin-bottom: 4px; }
.learn .opt { margin-top: 8px; }
@media (min-width: 640px) {
  .pair { flex-direction: row; }
  .pair > div { flex: 1; min-width: 0; }
}


.top-links { display: flex; align-items: center; gap: 12px; flex-shrink: 0; }
.share-note {
  font-size: 12px;
  color: var(--muted);
  min-height: 0;
  padding: 0;
}
.share-note:not(:empty) { padding: 0 0 6px; }
.timer { font-variant-numeric: tabular-nums; font-weight: 700; color: var(--blue); }
.timer.warn { color: var(--red); }

.look-rule {
  background: #161b22;
  border: 1px solid var(--line);
  border-radius: 12px;
  padding: 10px 12px;
  margin: 0 0 10px;
}
.look-rule p { margin: 0 0 8px; font-size: 14px; line-height: 1.45; color: var(--text); }
.look-rule p:last-child { margin-bottom: 0; }
  
#btn-trade {
  font-size: 12px;
  padding: 6px 4px;
  opacity: 0.92;
}
.ran-cue {
  background: #211e14;
  border: 1px solid #3d3419;
  color: #e3b341;
  border-radius: 12px;
  padding: 8px 12px;
  margin: 0 0 10px;
  font-size: 13px;
  font-weight: 700;
  line-height: 1.4;
}
.gg-checks {
  display: flex;
  flex-direction: column;
  gap: 6px;
  margin: 0 0 12px;
}
.chk {
  border-radius: 10px;
  padding: 8px 10px;
  font-weight: 700;
  font-size: 14px;
}
.chk.yes {
  background: rgba(63,185,80,0.15);
  color: #3fb950;
  border: 1px solid rgba(63,185,80,0.35);
}
.chk.no {
  background: rgba(248,81,73,0.12);
  color: #f85149;
  border: 1px solid rgba(248,81,73,0.3);
}
.l2-strip { font-size: 13px; }
.stage h2 { font-size: 20px; margin: 0 0 10px; }


.top { flex-wrap: wrap; }
.top-links { flex-wrap: wrap; justify-content: flex-end; row-gap: 0; }
.muted { color: var(--muted); font-size: 14px; line-height: 1.45; }
.flag-wrap { margin: 0 0 10px; }
.flag-btn {
  background: none; border: none; color: var(--muted);
  font: inherit; font-size: 12px; font-weight: 600;
  padding: 6px 0; cursor: pointer; text-decoration: underline;
  text-underline-offset: 2px;
}
.flag-box { margin-top: 6px; }
.flag-box textarea {
  width: 100%; min-height: 64px; margin: 6px 0;
  padding: 10px 12px; border-radius: 10px;
  border: 1px solid var(--line); background: var(--card);
  color: var(--text); font: inherit; font-size: 15px;
}
.flag-saved { font-size: 12px; color: var(--muted); margin-top: 2px; line-height: 1.35; }
.exam-badge {
  display: inline-block;
  background: #211e14; border: 1px solid #3d3419; color: #e3b341;
  border-radius: 999px; padding: 4px 10px; margin: 0 0 10px;
  font-size: 12px; font-weight: 700;
}
.cite { font-size: 13px; color: var(--muted); }
.cite a { color: var(--blue); }

</style>
</head>

    if (!side) return null;

    var bars = s.bars;
    var br = (typeof s.fc === "number" && s.fc >= 0 && s.fc < N_VIS) ? s.fc : currentCross(s, side);
    var start = br != null ? br : 0;
    var j, b, wick, closeThru;
    for (j = start; j < N_VIS; j++) {
      b = bars[j];
      if (side === "short" && b.l <= lv.m618) {
        wick = lv.m618 - b.l;
        closeThru = lv.m618 - b.c;
        return { i: j, side: side, wick: wick, closeThru: closeThru, byWick: closeThru < 0, px: b.l, level: lv.m618, when: barWhen(s, j) };
      }
      if (side === "long" && b.h >= lv.p618) {
        wick = b.h - lv.p618;
        closeThru = b.c - lv.p618;
        return { i: j, side: side, wick: wick, closeThru: closeThru, byWick: closeThru < 0, px: b.h, level: lv.p618, when: barWhen(s, j) };
      }
    }
    return null;
  }

  function closest618Shortfall(s) {
    var side = ribbonSide(s);
    if (!side) return null;
    var lv = s.levels;
    var vis = s.bars.slice(0, N_VIS);
    var ext, level;
    if (side === "long") {
      ext = Math.max.apply(null, vis.map(function (b) { return b.h; }));
      level = lv.p618;
      if (ext >= level) return null;
      return { pts: level - ext, ext: ext, level: level };
    }
    ext = Math.min.apply(null, vis.map(function (b) { return b.l; }));
    level = lv.m618;
    if (ext <= level) return null;
    return { pts: ext - level, ext: ext, level: level };
  }

  function first618AfterDecision(s) {
    var side = ribbonSide(s);
    if (!side) return null;
    var lv = s.levels;
    var j;
    for (j = N_VIS; j < s.bars.length; j++) {
      if (side === "long" && s.bars[j].h >= lv.p618) return { i: j, when: barWhen(s, j) };
      if (side === "short" && s.bars[j].l <= lv.m618) return { i: j, when: barWhen(s, j) };
    }
    return null;
  }

  function fmtPts(n) {
    if (n == null || !isFinite(n)) return "—";
    return Math.abs(n).toFixed(2);
  }

  function noTradeReason(s) {
    var setup = l2SetupOf(s);
    if (setup.action !== "N") return "This is a trade (" + (setup.kind === "gg" ? "Golden Gate" : "trigger") + ").";
    if (atFullRange(s) || s.tag === "ex" || setup.kind === "ex") return "too late at 1 ATR";
    if (s.tag === "dg" || setup.kind === "dg" || s.q2 === "D") return "ribbon against";
    if (s.q1 === "T" || setup.kind === "tw" || s.tag === "tw") return "chop/inside";
    if (first618Tag(s)) return "stale/past 61.8";
    if (s.tag === "nh" || setup.kind === "nh") return "didn't hold the ribbon";
    if (s.tag === "st" || setup.kind === "st") return "stale — no usable Golden Gate";
    if (s.tag === "in" || s.tag === "nc" || setup.kind === "in" || s.q2 === "I" || s.q2 === "W") return "no trigger break";
    return "chop/inside";
  }

  function noTradeDetail(s) {
    var why = noTradeReason(s);
    var tag618 = first618Tag(s);
    if (why === "stale/past 61.8" && tag618) {
      var end = tag618.side === "short" ? "low" : "high";
      var closeBit = tag618.byWick
        ? ("The close came back and finished " + fmtPts(Math.abs(tag618.closeThru)) + " points short of 61.8 — a wick tag still counts.")
        : ("The close also cleared 61.8 by " + fmtPts(tag618.closeThru) + " points.");
      return "No trade — stale/past 61.8. The " + tag618.when + " bar tagged 61.8 in the " + (tag618.side === "short" ? "short" : "long") + " direction: its " + end + " went " + fmtPts(tag618.wick) + " points through. " + closeBit + " Once 61.8 has been tagged, the Golden Gate is done, even if price comes back. The tagging bar is marked on the chart.";
    }
    if (why === "didn't hold the ribbon") {
      var miss = closest618Shortfall(s);
      var later = first618AfterDecision(s);
      var extra = "";
      if (miss) extra += " Price never tagged 61.8 on this chart — the closest extreme was " + fmtPts(miss.pts) + " points short.";
      if (later) extra += " 61.8 was first tagged after the decision bar (" + later.when + "); that does not count.";
      return "No trade — it tagged the Golden Gate (38.2) and pulled back, but it did not hold the ribbon." + extra;
    }
    if (why === "stale — no usable Golden Gate") {
      var miss2 = closest618Shortfall(s);
      var extra2 = miss2 ? " 61.8 was not tagged — the closest extreme was " + fmtPts(miss2.pts) + " points short." : " 61.8 was not tagged on this chart.";
      return "No trade — stale. The first close through the trigger already happened, and there is no usable Golden Gate (no 38.2 ribbon pullback that held)." + extra2;
    }
    if (why === "no trigger break") return "No trade — there is no first close through the call or put trigger, and no Golden Gate. Wait.";
    if (why === "too late at 1 ATR") return "No trade — too late at 1 ATR. The last close is already at full range. Mid-range 61.8 is the first target, not 'too late.'";
    if (why === "ribbon against") return "No trade — the ribbon points the other way. Do not fade a fanned ribbon.";
    if (why === "chop/inside") return "No trade — the ribbon is twisted or flat, or price is still chopping inside the fence. Stay out.";
    return "No trade. Reason: " + why + ".";
  }

  function lessonLines(s, id) {
    if (id === "no-trade") {
      var setup = l2SetupOf(s);
      if (setup.action !== "N") {
        return [
          "This one is a trade: a " + (setup.action === "L" ? "long" : "short") + " " + (setup.kind === "gg" ? "Golden Gate" : "trigger") + ".",
          setup.kind === "gg"
            ? "38.2 is tagged, price pulled back to the ribbon or the trigger and held, and 61.8 has not been tagged yet."
            : "This is the first close through the trigger, the ribbon agrees, and price is not yet at 1 ATR."
        ];
      }
      return [
        noTradeDetail(s),
        "Reason: " + why + "."
      ];
    }
    if (id === "ribbon") {
      return [
        s.q1 === "G" ? "The 8 is above the 21, and the 21 is above the 34 — green, fanned up." : s.q1 === "R" ? "The 8 is below the 21, and the 21 is below the 34 — red, fanned down." : "The 8, 21, and 34 are tangled or sitting on top of each other. That is twisted or flat.",
        "Trade only with a clearly fanned ribbon. Twisted or flat means stay out."
      ];
    }
    if (id === "fence") {
      return [
        s.q2 === "I" || s.q2 === "W" ? "The last 15-minute close is still inside the trigger fence (±23.6% of ATR from the prior day close)." : "A 15-minute bar has already closed outside that fence.",
        "First question: did a bar close outside the box? If not, there is no trigger trade yet."
      ];
    }
    if (id === "side") {
      return [
        s.q2 === "D" ? "Price closed outside the fence, but on the side the ribbon does not point. That is a fade. No trade." : "The close is on the same side the ribbon points.",
        "Never fade a clearly fanned ribbon."
      ];
    }
    if (id === "fresh-pull") {
      return LOOK_RULE.concat([lookWhy(s)]);
    }
    if (id === "fresh-stale") {
      return [
        s.q2 === "F" && !atFullRange(s) ? "This is the first close through the trigger. That is the close that counts for a Trigger trade." : "The first close already happened earlier, or the move is already at full range. An old break with no 38.2 ribbon pullback is stale. No trade.",
        "Stale is not the same as extended: extended means price already reached 1 ATR (full range), not merely 61.8."
      ];
    }
    if (id === "extended") {
      return [
        atFullRange(s) ? "The last close is already at or through 1 ATR (full range). Too late to chase the day-mode move." : "Price is not yet at full range (1 ATR). Mid-range 61.8 is the first target, not 'too late.'",
        "Extended means full range (1 ATR). That is not the same as stale, and it is not the same as being at 61.8."
      ];
    }
    return [
      tagged618SinceBreak(s)
        ? "61.8 has already been tagged since the trigger break. Once that happens, the Golden Gate is done (stale), even if price comes back. No new GG entry."
        : s.q3 === "Y"
        ? "Golden Gate is the 38.2 level. Once tagged, there is about a 60% chance of reaching 61.8, and 61.8 has not been tagged yet. This one also has a ribbon pullback with trend — a typical entry."
        : s.tag === "nh"
          ? "It tagged the Golden Gate (38.2), but it did not hold the ribbon. That is not a usable GG entry."
          : "The Golden Gate is 38.2. A typical entry is a pullback to the ribbon (8 / 21 / 34) with clear trend, targeting the 61.8 Golden FIB — and only if 61.8 has not already been tagged.",
      "Official first target is 61.8 (Golden FIB). Once 61.8 has been tagged, the Golden Gate is done (stale), even if price comes back. Full range is 1 ATR."
    ];
  }

  function acc(ok, n) { return n ? ok / n : 0; }

  function todayStamp() {
    var d = new Date();
    var m = String(d.getMonth() + 1).padStart(2, "0");
    var day = String(d.getDate()).padStart(2, "0");
    return d.getFullYear() + "-" + m + "-" + day;
  }

  function recentAcc(xs, n) {
    var recent = xs.slice(-n);
    var ok = 0;
    for (var i = 0; i < recent.length; i++) if (recent[i].correct) ok += 1;
    return { n: recent.length, acc: acc(ok, recent.length), ok: ok };
  }

  function isBasicSkill(id) {
    return id === "ribbon" || id === "fence" || id === "side";
  }

  function skillMeter(logs, id, bit) {
    /* Recomputed from logs every time, so new thresholds apply to existing saves. */
    var xs = logs.filter(function (l) { return skillOfLog(l) === id; });
    if (!xs.length) return "new";
    /* 10/10 last-10 mastered is ONLY for ribbon / fence / side. Q1 and later skills never use that shortcut. */
    if (isBasicSkill(id) && xs.length >= BASIC_MASTER_MIN) {
      var b = recentAcc(xs, BASIC_MASTER_MIN);
      if (b.n >= BASIC_MASTER_MIN && b.acc >= BASIC_MASTER_ACC) return "mastered";
    }
    /* Q1 and later: mastered only if the last 20 attempts are at least 90%. The 10/10 basics shortcut never applies here. */
    if (xs.length >= MASTER_MIN) {
      var m = recentAcc(xs, MASTER_N);
      if (m.n >= MASTER_MIN && m.acc >= MASTER_ACC) return "mastered";
    }
    if (xs.length >= SOLID_MIN) {
      var s = recentAcc(xs, SOLID_N);
      if (s.n >= SOLID_MIN && s.acc >= SOLID_ACC) return "solid";
    }
    return "learning";
  }

  function meterRank(lvl) {
    return lvl === "new" ? 0 : lvl === "learning" ? 1 : lvl === "solid" ? 2 : 3;
  }

  function lowestSkill(save) {
    var best = "fresh-stale", bestRank = 99, bestN = 1e9;
    for (var i = 0; i < SKILL_DEFS.length; i++) {
      var def = SKILL_DEFS[i];
      var lvl = skillMeter(save.logs, def.id, save.skills && save.skills[def.id]);
      var n = 0;
      for (var j = 0; j < save.logs.length; j++) if (skillOfLog(save.logs[j]) === def.id) n += 1;
      var rank = meterRank(lvl);
      if (rank < bestRank || (rank === bestRank && n < bestN)) {
        best = def.id;
        bestRank = rank;
        bestN = n;
      }
    }
    return best;
  }

  function touchSkill(prev, id, correct) {
    var skills = Object.assign({}, prev.skills || {});
    var cur = skills[id] || { recent: [], lastAt: 0 };
    var recent = (cur.recent || []).concat([correct]).slice(-8);
    skills[id] = { recent: recent, lastAt: Date.now(), lastDay: todayStamp() };
    return skills;
  }

  function emptySave() {
    return {
      v: 1,
      logs: [],
      charts: [],
      misses: [],
      seen: [],
      shown: [],
      lastSeen: {},
      lastResult: {},
      streak: 0,
      bestStreak: 0,
      points: 0,
      skills: {},
      session: null,
      l2: emptyL2(),
      flags: [],
      exam: emptyExam()
    };
  }

  function emptyExam() {
    return { logs: [], best: 0, last: null, session: null };
  }

  function migrateExam(raw) {
    var d = emptyExam();
    if (!raw || typeof raw !== "object") return d;
    d.logs = Array.isArray(raw.logs) ? raw.logs : [];
    d.best = Number(raw.best) || 0;
    d.last = raw.last && typeof raw.last === "object" ? raw.last : null;
    d.session = raw.session && typeof raw.session === "object" ? raw.session : null;
    return d;
  }

  function migrateFlags(raw) {
    if (!Array.isArray(raw)) return [];
    return raw.filter(function (f) { return f && f.id; }).map(function (f) {
      return {
        id: String(f.id),
        note: f.note ? String(f.note).slice(0, 500) : "",
        view: f.view === "trade" ? "trade" : "play",
        at: Number(f.at) || Date.now()
      };
    });
  }

  function emptyL2() {
    return {
      trades: [],
      rSum: 0,
      dollars: 0,
      processOk: 0,
      processN: 0,
      sessions: 0,
      stoppedSessions: 0,
      errors: [],
      session: null
    };
  }

  function migrateL2(raw) {
    var d = emptyL2();
    if (!raw || typeof raw !== "object") return d;
    d.trades = Array.isArray(raw.trades) ? raw.trades : [];
    d.rSum = Number(raw.rSum) || 0;
    d.dollars = Number(raw.dollars) || 0;
    d.processOk = Number(raw.processOk) || 0;
    d.processN = Number(raw.processN) || 0;
    d.sessions = Number(raw.sessions) || 0;
    d.stoppedSessions = Number(raw.stoppedSessions) || 0;
    d.errors = Array.isArray(raw.errors) ? raw.errors : [];
    d.session = raw.session && typeof raw.session === "object" ? raw.session : null;
    d.resume = !!raw.resume;
    return d;
  }

  function rebuildSpacing(s) {
    var shown = Array.isArray(s.shown) && s.shown.length ? s.shown.slice() : (s.charts || []).map(function (c) { return c.id; });
    s.shown = shown;
    var lastSeen = s.lastSeen && typeof s.lastSeen === "object" ? s.lastSeen : {};
    if (!Object.keys(lastSeen).length) {
      shown.forEach(function (id, i) { lastSeen[id] = i; });
    }
    s.lastSeen = lastSeen;
    var lastResult = s.lastResult && typeof s.lastResult === "object" ? s.lastResult : {};
    if (!Object.keys(lastResult).length) {
      (s.charts || []).forEach(function (c, i) {
        lastResult[c.id] = { ok: !!c.allOk, at: i };
      });
    }
    s.lastResult = lastResult;
    return s;
  }

  function parseSave(raw) {
    if (!raw) return emptySave();
    try {
      var p = JSON.parse(raw);
      if (!p || !Array.isArray(p.logs)) return emptySave();
      /* v is 1 for original and migrated saves. Missing new fields are filled in place. */
      if (p.v != null && p.v !== 1 && p.v !== 2) return emptySave();
      return rebuildSpacing({
        v: 1,
        logs: p.logs || [],
        charts: p.charts || [],
        misses: p.misses || [],
        seen: Array.isArray(p.seen) ? p.seen : [],
        shown: Array.isArray(p.shown) ? p.shown : [],
        lastSeen: p.lastSeen && typeof p.lastSeen === "object" ? p.lastSeen : {},
        lastResult: p.lastResult && typeof p.lastResult === "object" ? p.lastResult : {},
        streak: Number(p.streak) || 0,
        bestStreak: Number(p.bestStreak) || 0,
        points: Number(p.points) || 0,
        skills: p.skills && typeof p.skills === "object" ? p.skills : {},
        session: p.session && typeof p.session === "object" ? p.session : null,
        l2: migrateL2(p.l2),
        flags: migrateFlags(p.flags),
        exam: migrateExam(p.exam)
      });
    } catch (e) {
      return emptySave();
    }
  }

  function loadSave() {
    try {
      return parseSave(localStorage.getItem(STORAGE_KEY));
    } catch (e) {
      return emptySave();
    }
  }

  function writeSave(s) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(s));
      return true;
    } catch (e) {
      return false;
    }
  }

  function requestPersist() {
    try {
      if (navigator.storage && navigator.storage.persist) navigator.storage.persist();
    } catch (e) {}
  }

  function difficultyOf(s) {
    var b = s.bars[N_VIS - 1];
    if (!b || !s.atr) return 0;
    var atr = s.atr;
    var fan = Math.abs(b.e8 - b.e34) / atr;
    var near = function (level) { return Math.abs(b.c - level) / atr; };
    var lv = s.levels;
    var score = 0;
    if (fan < 0.12) score += 2;
    else if (fan < 0.18) score += 1;
    if (near(lv.pTrig) < 0.08 || near(lv.mTrig) < 0.08) score += 2;
    if (near(lv.p382) < 0.1 || near(lv.m382) < 0.1) score += 1;
    if (near(lv.p618) < 0.12 || near(lv.m618) < 0.12) score += 2;
    return score;
  }

  function skillPool(all, skill, similar) {
    var out = [];
    for (var i = 0; i < all.length; i++) {
      var s = all[i];
      if (similar === true) {
        if (skillMatches(s, skill, true)) out.push(s);
      } else if (similar === false) {
        if (skillMatches(s, skill, false)) out.push(s);
      } else if (skillMatches(s, skill, true) || skillMatches(s, skill, false)) {
        out.push(s);
      }
    }
    return out;
  }

  function recencyAgo(id) {
    var last = save.lastSeen && save.lastSeen[id];
    if (last === undefined || last === null) return 1e9;
    return (save.shown || []).length - 1 - last;
  }

  function isUnseen(id) {
    return !save.lastSeen || save.lastSeen[id] === undefined;
  }

  function spacingOk(id, relax) {
    var ago = recencyAgo(id);
    if (ago >= 1e8) return true;
    if (relax < 2 && ago < RECENT_WINDOW) return false;
    var res = save.lastResult && save.lastResult[id];
    if (res && relax < 1) {
      var gap = res.ok ? OK_GAP : MISS_GAP;
      /* Misses can return sooner than corrects, but never inside the 30-chart window
         unless the skill pool is exhausted (relax >= 2). */
      if (ago < Math.max(gap, res.ok ? OK_GAP : 0)) return false;
    }
    return true;
  }

  function sortCandidates(xs, hard) {
    return xs.slice().sort(function (a, b) {
      var ua = isUnseen(a.id) ? 0 : 1;
      var ub = isUnseen(b.id) ? 0 : 1;
      if (ua !== ub) return ua - ub;
      var ga = recencyAgo(a.id);
      var gb = recencyAgo(b.id);
      if (gb !== ga) return gb - ga;
      if (hard) {
        var da = difficultyOf(a);
        var db = difficultyOf(b);
        if (db !== da) return db - da;
      }
      return a.tmin - b.tmin;
    });
  }

  function pickNoTradeSet(all, exclude, n) {
    var blocked = {};
    (exclude || []).forEach(function (id) { blocked[id] = true; });
    var skips = [], takes = [];
    all.forEach(function (s) {
      if (blocked[s.id]) return;
      if (l2SetupOf(s).action === "N") skips.push(s);
      else takes.push(s);
    });
    var wantSkip = Math.max(1, Math.round(n * 0.75));
    var out = sortCandidates(skips, false).slice(0, wantSkip);
    out.forEach(function (s) { blocked[s.id] = true; });
    var rest = sortCandidates(takes.filter(function (s) { return !blocked[s.id]; }), false);
    for (var i = 0; i < rest.length && out.length < n; i++) out.push(rest[i]);
    if (out.length < n) {
      var more = sortCandidates(skips.filter(function (s) { return !blocked[s.id]; }), false);
      for (var j = 0; j < more.length && out.length < n; j++) out.push(more[j]);
    }
    out.sort(function (a, b) { return ((a.tmin + 17) * 11 % 89) - ((b.tmin + 17) * 11 % 89); });
    return out.slice(0, n);
  }

  function pickCharts(all, skill, exclude, n, similarFirst, hard) {
    var blocked = {};
    (exclude || []).forEach(function (id) { blocked[id] = true; });
    function gather(similar, relax) {
      var pool = skillPool(all, skill, similar);
      var ok = [];
      for (var i = 0; i < pool.length; i++) {
        var s = pool[i];
        if (blocked[s.id]) continue;
        if (!spacingOk(s.id, relax)) continue;
        ok.push(s);
      }
      return sortCandidates(ok, hard);
    }
    var out = [];
    function takeFrom(similar, want) {
      var relax;
      for (relax = 0; relax <= 2 && want > 0; relax++) {
        var xs = gather(similar, relax);
        for (var i = 0; i < xs.length && want > 0; i++) {
          if (blocked[xs[i].id]) continue;
          out.push(xs[i]);
          blocked[xs[i].id] = true;
          want--;
        }
      }
    }
    if (similarFirst) {
      takeFrom(true, Math.min(3, n));
      takeFrom(false, n - out.length);
    } else {
      takeFrom(true, n);
      if (out.length < n) takeFrom(false, n - out.length);
    }
    if (out.length < n) {
      var rest = sortCandidates(all.filter(function (s) { return !blocked[s.id]; }), hard);
      for (var k = 0; k < rest.length && out.length < n; k++) {
        out.push(rest[k]);
        blocked[rest[k].id] = true;
      }
    }
    return out.slice(0, n);
  }

  function skillStats(sv, id) {
    var n = 0, ok = 0;
    for (var i = 0; i < sv.logs.length; i++) {
      if (skillOfLog(sv.logs[i]) === id) {
        n += 1;
        if (sv.logs[i].correct) ok += 1;
      }
    }
    var lvl = skillMeter(sv.logs, id, sv.skills && sv.skills[id]);
    return { id: id, n: n, ok: ok, lvl: lvl, rank: meterRank(lvl) };
  }

  function lastSkillAcc(sv, id, n) {
    var xs = (sv.logs || []).filter(function (l) { return skillOfLog(l) === id; }).slice(-n);
    var ok = 0;
    for (var i = 0; i < xs.length; i++) if (xs[i].correct) ok += 1;
    return { n: xs.length, acc: acc(ok, xs.length), ok: ok };
  }

  function q1NeedsDrill(sv) {
    var a = lastSkillAcc(sv, "fresh-pull", 20);
    return a.n < 20 || a.acc < 0.85;
  }

  function chooseSkill(sv) {
    var stats = SKILL_DEFS.map(function (d) { return skillStats(sv, d.id); });
    var weak = stats.filter(function (s) { return s.lvl !== "mastered"; });
    var mastered = stats.filter(function (s) { return s.lvl === "mastered"; });
    weak.sort(function (a, b) { return a.rank - b.rank || a.n - b.n; });
    var nShown = (sv.shown || []).length;
    if (!weak.length) {
      var i = nShown % stats.length;
      return { skill: stats[i].id, hard: true, speed: true, skillOnly: false };
    }
    /* Mastered basics stay at about 1 in 7. */
    if (mastered.length && nShown && nShown % 7 === 6) {
      var basics = mastered.filter(function (s) { return s.id === "ribbon" || s.id === "fence" || s.id === "side"; });
      var pool = basics.length ? basics : mastered;
      pool.sort(function (a, b) { return a.n - b.n; });
      return { skill: pool[0].id, hard: true, speed: true, skillOnly: true };
    }
    /* About half of charts are Q1 contrast drills until 85% on the last 20 look questions. */
    if (q1NeedsDrill(sv) && nShown % 2 === 0) {
      return { skill: "fresh-pull", hard: false, speed: false, skillOnly: true, contrast: true };
    }
    /* Undersampled later skills get extra reps. */
    var nt = skillStats(sv, "no-trade");
    if (nt.lvl !== "mastered" && nShown && nShown % 3 === 2) {
      return { skill: "no-trade", hard: false, speed: false, skillOnly: true };
    }
    var thin = stats.filter(function (s) {
      return (s.id === "fresh-stale" || s.id === "extended" || s.id === "gg" || s.id === "no-trade") && s.n < 15;
    });
    if (thin.length) {
      thin.sort(function (a, b) { return a.n - b.n || a.rank - b.rank; });
      return { skill: thin[0].id, hard: false, speed: false, skillOnly: true };
    }
    var pick = weak[0];
    return {
      skill: pick.id,
      hard: pick.lvl === "solid" || pick.lvl === "mastered",
      speed: pick.lvl === "mastered",
      skillOnly: pick.id === "fresh-pull" && q1NeedsDrill(sv),
      contrast: pick.id === "fresh-pull" && q1NeedsDrill(sv)
    };
  }

  function byId(all, id) {
    for (var i = 0; i < all.length; i++) if (all[i].id === id) return all[i];
    return null;
  }

  /* ---------- chart ---------- */
  function esc(s) {
    return String(s).replace(/&/g, "&amp;").replace(/</g, "&lt;").replace(/>/g, "&gt;").replace(/"/g, "&quot;");
  }

  function drawChart(scenario, shown, highlight, compact, trade) {
    var W = 800, H = compact ? 230 : 520;
    var padL = 58, padR = 86, padT = 18, padB = 32;
    var plotW = W - padL - padR, plotH = H - padT - padB;
    var bars = scenario.bars.slice(0, Math.max(1, Math.min(shown, BAR_N)));
    var lv = scenario.levels;
    var levelList = [
      { y: lv.p100, name: "+1 ATR" },
      { y: lv.p786, name: "+78.6" },
      { y: lv.p618, name: "+61.8" },
      { y: lv.p50, name: "+50" },
      { y: lv.p382, name: "+GG 38.2" },
      { y: lv.pTrig, name: "+Call", fence: true },
      { y: lv.pdc, name: "PDC", solid: true },
      { y: lv.mTrig, name: "−Put", fence: true },
      { y: lv.m382, name: "−GG 38.2" },
      { y: lv.m50, name: "−50" },
      { y: lv.m618, name: "−61.8" },
      { y: lv.m786, name: "−78.6" },
      { y: lv.m100, name: "−1 ATR" }
    ];
    var lo = Math.min.apply(null, bars.map(function (b) { return b.l; }));
    var hi = Math.max.apply(null, bars.map(function (b) { return b.h; }));
    var padPx = Math.max((hi - lo) * 0.08, lv.atr * 0.04);
    lo -= padPx; hi += padPx;
    var near = levelList.filter(function (L) { return L.y >= lo - lv.atr * 0.35 && L.y <= hi + lv.atr * 0.35; });
    if (near.length) {
      lo = Math.min(lo, Math.min.apply(null, near.map(function (L) { return L.y; })));
      hi = Math.max(hi, Math.max.apply(null, near.map(function (L) { return L.y; })));
    }
    var tag618 = first618Tag(scenario);
    var side618 = ribbonSide(scenario);
    var lvl618 = side618 === "short" ? lv.m618 : side618 === "long" ? lv.p618 : null;
    /* Always keep the trade-direction 61.8 line in view on setup charts so a miss or a wick tag is visible. */
    if (lvl618 != null) {
      lo = Math.min(lo, lvl618);
      hi = Math.max(hi, lvl618);
    }
    if (tag618) {
      lo = Math.min(lo, tag618.px, tag618.level);
      hi = Math.max(hi, tag618.px, tag618.level);
    }
    if (trade) {
      [trade.entry, trade.exit, trade.stopPx, trade.tgtPx].forEach(function (p) {
        if (p != null && isFinite(p)) { lo = Math.min(lo, p); hi = Math.max(hi, p); }
      });
    }
    if (hi <= lo) hi = lo + 1;
    function yAt(p) { return padT + ((hi - p) / (hi - lo)) * plotH; }
    var slot = plotW / BAR_N;
    var bodyW = Math.max(5, slot * 0.72);
    function xAt(i) { return padL + slot * (i + 0.5); }
    var visibleLevels = levelList.filter(function (L) { return L.y >= lo && L.y <= hi; });
    var ticks = [];
    for (var t = 0; t < 5; t++) ticks.push(hi - ((hi - lo) * t) / 4);
    function poly(key) {
      return bars.map(function (b, i) { return xAt(i).toFixed(1) + "," + yAt(b[key]).toFixed(1); }).join(" ");
    }
    var decX = padL + slot * N_VIS;
    var glow = highlight === "ribbon";
    var lookOn = highlight === "look";
    var fenceOn = highlight === "fence" || lookOn;
    var gateOn = highlight === "gate" || lookOn;
    var marks = lookOn ? lookMarks(scenario) : null;
    var yTopFence = yAt(Math.min(hi, Math.max(lo, lv.pTrig)));
    var yBotFence = yAt(Math.min(hi, Math.max(lo, lv.mTrig)));
    var parts = [];
    parts.push('<svg viewBox="0 0 ' + W + ' ' + H + '" width="100%" role="img" aria-label="15-minute candlestick chart with ATR levels and pivot ribbon">');
    parts.push('<rect x="0" y="0" width="' + W + '" height="' + H + '" fill="#0e1116"/>');
    if (fenceOn) {
      parts.push('<rect x="' + padL + '" y="' + Math.min(yTopFence, yBotFence) + '" width="' + plotW + '" height="' + Math.max(8, Math.abs(yBotFence - yTopFence)) + '" fill="rgba(88,166,255,0.12)"/>');
    }
    visibleLevels.forEach(function (L) {
      var is618 = tag618 && Math.abs(L.y - tag618.level) < 1e-9;
      var show618 = lvl618 != null && Math.abs(L.y - lvl618) < 1e-9;
      var strong = L.solid || (fenceOn && L.fence) || (gateOn && L.name.indexOf("38.2") >= 0) || is618 || show618;
      var stroke = is618 ? "#e3b341" : show618 ? "#c9a227" : L.solid ? "#6e7681" : fenceOn && L.fence ? "#58a6ff" : "#30363d";
      var labelFill = is618 || show618 ? "#e3b341" : "#8b949e";
      var label = L.name + (is618 ? " tagged" : "");
      parts.push('<line x1="' + padL + '" x2="' + (padL + plotW) + '" y1="' + yAt(L.y) + '" y2="' + yAt(L.y) + '" stroke="' + stroke + '" stroke-width="' + (is618 ? 2.4 : strong ? 2 : 1) + '"' + (L.solid || is618 ? "" : ' stroke-dasharray="5 4"') + '/>');
      parts.push('<text x="' + (padL + plotW + 6) + '" y="' + (yAt(L.y) + 3) + '" fill="' + labelFill + '" font-size="11" font-family="system-ui,sans-serif">' + esc(label) + "</text>");
    });
    ticks.forEach(function (tv) {
      parts.push('<text x="' + (padL - 6) + '" y="' + (yAt(tv) + 3) + '" text-anchor="end" fill="#8b949e" font-size="11" font-family="system-ui,sans-serif">' + esc(fmt(tv)) + "</text>");
    });
    parts.push('<line x1="' + decX + '" x2="' + decX + '" y1="' + padT + '" y2="' + (padT + plotH) + '" stroke="#6e7681" stroke-width="1.2" stroke-dasharray="3 3"/>');
    if (glow) {
      var rev = [];
      for (var r = bars.length - 1; r >= 0; r--) rev.push(xAt(r).toFixed(1) + "," + yAt(bars[r].e34).toFixed(1));
      parts.push('<polyline points="' + poly("e8") + " " + rev.join(" ") + '" fill="rgba(63,185,80,0.12)" stroke="none"/>');
    }
    parts.push('<polyline points="' + poly("e34") + '" fill="none" stroke="#58a6ff" stroke-width="' + (glow ? 3.2 : 1.6) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    parts.push('<polyline points="' + poly("e21") + '" fill="none" stroke="#3fb950" stroke-width="' + (glow ? 3.4 : 1.8) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    parts.push('<polyline points="' + poly("e8") + '" fill="none" stroke="#56d364" stroke-width="' + (glow ? 4 : 2.2) + '" stroke-linejoin="round" stroke-linecap="round"/>');
    bars.forEach(function (b, i) {
      var up = b.c >= b.o;
      var stroke = up ? "#3fb950" : "#f85149";
      var fill = up ? "#16351f" : "#3d1618";
      var x = xAt(i);
      var yTop = yAt(Math.max(b.o, b.c));
      var yBot = yAt(Math.min(b.o, b.c));
      var bh = Math.max(1.6, yBot - yTop);
      var isDec = i === N_VIS - 1;
      var isFc = marks ? marks.br === i : (scenario.fc === i && (gateOn || fenceOn));
      var isTg = marks ? marks.tag === i : (scenario.tg === i && gateOn);
      var isPull = !!(marks && marks.pull === i);
      var is618bar = !!(tag618 && tag618.i === i);
      if (isFc || isTg || isDec || isPull || is618bar) {
        var band = is618bar ? "rgba(227,179,65,0.28)" : isTg || isFc || isPull ? "rgba(210,153,34,0.18)" : "rgba(110,118,129,0.12)";
        parts.push('<rect x="' + (x - bodyW) + '" y="' + padT + '" width="' + (bodyW * 2) + '" height="' + plotH + '" fill="' + band + '"/>');
      }
      parts.push('<line x1="' + x + '" x2="' + x + '" y1="' + yAt(b.h) + '" y2="' + yAt(b.l) + '" stroke="' + stroke + '" stroke-width="' + (isDec || isFc || isPull || is618bar ? 2.4 : 1.5) + '"/>');
      parts.push('<rect x="' + (x - bodyW / 2) + '" y="' + yTop + '" width="' + bodyW + '" height="' + bh + '" fill="' + fill + '" stroke="' + stroke + '" stroke-width="' + (isDec || isFc || isPull || is618bar ? 2 : 1.2) + '"/>');
      if (is618bar) {
        parts.push('<circle cx="' + x + '" cy="' + yAt(tag618.px) + '" r="6" fill="#e3b341" stroke="#f0d060" stroke-width="1.5"/>');
        parts.push('<text x="' + x + '" y="' + (padT + plotH + 20) + '" text-anchor="middle" fill="#e3b341" font-size="10" font-weight="700" font-family="system-ui,sans-serif">61.8 ' + (tag618.byWick ? "wick" : "tag") + "</text>");
      }
      if (isTg) {
        var cy = yAt(scenario.q1 === "R" || scenario.code === "SG" || scenario.code === "ST" ? b.l : b.h);
        parts.push('<circle cx="' + x + '" cy="' + cy + '" r="6" fill="#58a6ff" stroke="#79c0ff" stroke-width="1.5"/>');
      }
      if (isPull) {
        parts.push('<circle cx="' + x + '" cy="' + yAt(b.e8) + '" r="5" fill="#d29922" stroke="#e3b341" stroke-width="1.5"/>');
      }
    });
    if (lookOn && marks) {
      var caps = {};
      function addCap(idx, name) {
        if (idx == null || idx < 0) return;
        caps[idx] = (caps[idx] || []);
        if (caps[idx].indexOf(name) < 0) caps[idx].push(name);
      }
      var ran = lookRanInfo(scenario);
      addCap(marks.br, ran.ago != null && ran.ago >= 2 ? ("Break · " + ran.ago + " ago") : "Break");
      addCap(marks.tag, "38.2");
      addCap(marks.pull, "8 EMA");
      addCap(marks.now, "Now");
      Object.keys(caps).forEach(function (k) {
        var i = Number(k);
        parts.push('<text x="' + xAt(i) + '" y="' + (padT + plotH + 20) + '" text-anchor="middle" fill="#e6edf3" font-size="10" font-weight="700" font-family="system-ui,sans-serif">' + esc(caps[k].join(" · ")) + "</text>");
      });
      if (ran && ran.dist != null && isFinite(ran.dist) && (lookWant(scenario) === "N" || ran.at618 || (ran.ago != null && ran.ago >= 2))) {
        var cue = (ran.dist >= 0 ? "+" : "") + fmtAtrPct(ran.dist) + " from trigger";
        if (atFullRange(scenario)) cue += " · already at 1 ATR (full range)";
        else if (tagged618SinceBreak(scenario)) cue += " · 61.8 already tagged — GG done (stale)";
        else if (ran.at618) cue += " · mid-range 61.8 (first target, not too late)";
        parts.push('<text x="' + (padL + plotW - 4) + '" y="' + (padT + 14) + '" text-anchor="end" fill="#e3b341" font-size="12" font-weight="700" font-family="system-ui,sans-serif">' + esc(cue) + "</text>");
      }
    } else {
      parts.push('<text x="' + (decX - 4) + '" y="' + (padT + plotH + 20) + '" text-anchor="end" fill="#8b949e" font-size="11" font-family="system-ui,sans-serif">Decision</text>');
    }
    if (trade && trade.entry != null) {
      function mark(y, color, label) {
        if (y == null || !isFinite(y)) return;
        parts.push('<line x1="' + padL + '" x2="' + (padL + plotW) + '" y1="' + yAt(y) + '" y2="' + yAt(y) + '" stroke="' + color + '" stroke-width="1.6" stroke-dasharray="4 3"/>');
        parts.push('<text x="' + (padL + 4) + '" y="' + (yAt(y) - 4) + '" fill="' + color + '" font-size="11" font-weight="700" font-family="system-ui,sans-serif">' + esc(label) + "</text>");
      }
      mark(trade.entry, "#79c0ff", "Entry");
      mark(trade.stopPx, "#f85149", "Stop");
      mark(trade.tgtPx, "#3fb950", "Target");
      if (trade.exit != null) mark(trade.exit, "#e3b341", "Exit");
    }
    parts.push("</svg>");
    return parts.join("");
  }

  /* ---------- app state ---------- */
  var ALL = loadScenarios(window.SATY_PACK);
  var save = loadSave();
  var ui = {
    view: "play", /* play | learn */
    phase: "ask", /* ask | feedback | lesson */
    skill: "fresh-pull",
    focus: false,
    hard: false,
    speed: false,
    timeout: false,
    skillOnly: false,
    contrast: false,
    quiz: null, /* null | bars | bars-ok | bars-bad */
    shareNote: "",
    ids: [],
    index: 0,
    qIndex: 0,
    setLogs: [],
    round: [],
    picked: null,
    ok: false,
    lessonSkill: null,
    startMs: Date.now(),
    speedLeft: 0
  };
  var autoTimer = null;
  var speedTimer = null;

  function clearAuto() {
    if (autoTimer) { clearTimeout(autoTimer); autoTimer = null; }
  }

  function clearSpeed() {
    if (speedTimer) { clearInterval(speedTimer); speedTimer = null; }
  }

  function markShown(id) {
    if (!id) return;
    save.shown = (save.shown || []).concat([id]);
    if (!save.lastSeen) save.lastSeen = {};
    save.lastSeen[id] = save.shown.length - 1;
  }

  function markResult(id, allOk) {
    if (!id) return;
    if (!save.lastResult) save.lastResult = {};
    save.lastResult[id] = { ok: !!allOk, at: (save.shown || []).length };
  }

  function current() {
    return byId(ALL, ui.ids[ui.index]) || null;
  }

  function questions() {
    var s = current();
    if (!s) return ["qlook"];
    if ((ui.focus || ui.skillOnly) && ui.skill) return [skillQid(ui.skill)];
    return guidedQueueFor(s, save.logs);
  }

  function qidNow() {
    var qs = questions();
    return qs[Math.min(ui.qIndex, Math.max(0, qs.length - 1))] || "qlook";
  }

  function snapshot() {
    save.session = {
      view: ui.view,
      phase: ui.phase,
      skill: ui.skill,
      focus: ui.focus,
      hard: ui.hard === true,
      speed: ui.speed === true,
      ids: ui.ids,
      index: ui.index,
      qIndex: ui.qIndex,
      setLogs: ui.setLogs,
      round: ui.round,
      picked: ui.picked,
      ok: ui.ok,
      lessonSkill: ui.lessonSkill,
      timeout: ui.timeout === true,
      skillOnly: ui.skillOnly === true,
      contrast: ui.contrast === true,
      quiz: ui.quiz || null
    };
    writeSave(save);
  }

  function restoreSession() {
    var ses = save.session;
    if (!ses || !Array.isArray(ses.ids) || !ses.ids.length) return false;
    var ids = ses.ids.filter(function (id) { return !!byId(ALL, id); });
    if (!ids.length) return false;
    ui.view = ses.view === "learn" || ses.view === "exam" ? ses.view : "play";
    ui.phase = ses.phase === "feedback" || ses.phase === "lesson" || ses.phase === "ask" ? ses.phase : "ask";
    ui.skill = ses.skill || chooseSkill(save).skill;
    ui.focus = ses.focus === true;
    ui.hard = ses.hard === true;
    ui.speed = ses.speed === true;
    ui.timeout = ses.timeout === true;
    ui.skillOnly = ses.skillOnly === true;
    ui.contrast = ses.contrast === true;
    ui.quiz = ses.quiz || null;
    ui.ids = ids;
    ui.index = Math.max(0, Math.min(ses.index || 0, ids.length - 1));
    ui.qIndex = Math.max(0, ses.qIndex || 0);
    ui.setLogs = Array.isArray(ses.setLogs) ? ses.setLogs : [];
    ui.round = Array.isArray(ses.round) ? ses.round : [];
    ui.picked = ses.picked || null;
    ui.ok = ses.ok === true;
    ui.lessonSkill = ses.lessonSkill || null;
    ui.startMs = Date.now();
    if (ui.phase === "feedback" && ui.ok) {
      autoTimer = setTimeout(function () {
        autoTimer = null;
        afterCorrect();
      }, AUTO_OK_MS);
    } else if (ui.phase === "ask") {
      startSpeedClock();
    }
    return true;
  }

  function lastShownLook() {
    var shown = save.shown || [];
    for (var i = shown.length - 1; i >= 0; i--) {
      var s = byId(ALL, shown[i]);
      if (s) return lookWant(s);
    }
    return null;
  }

  function pickLookContrast(all, exclude, n) {
    var blocked = {};
    (exclude || []).forEach(function (id) { blocked[id] = true; });
    var out = [];
    var shown = save.shown || [];
    var lastId = shown.length ? shown[shown.length - 1] : null;
    var partner = lastId && LOOK_PAIRS[lastId] ? byId(all, LOOK_PAIRS[lastId]) : null;
    if (partner && !blocked[partner.id] && spacingOk(partner.id, 1)) {
      out.push(partner);
      blocked[partner.id] = true;
    }
    var last = lastShownLook();
    var order = last === "B" ? ["P", "N", "B"] : last === "P" ? ["B", "N", "P"] : ["B", "P", "N"];
    var relax, o, i;
    for (relax = 0; relax <= 2 && out.length < n; relax++) {
      for (o = 0; o < order.length && out.length < n; o++) {
        var xs = all.filter(function (s) {
          return !blocked[s.id] && lookWant(s) === order[o] && spacingOk(s.id, relax);
        });
        xs = sortCandidates(xs, false);
        xs.sort(function (a, b) {
          var pa = LOOK_PAIRS[a.id] ? 0 : 1;
          var pb = LOOK_PAIRS[b.id] ? 0 : 1;
          return pa - pb;
        });
        if (xs.length) {
          out.push(xs[0]);
          blocked[xs[0].id] = true;
        }
      }
    }
    if (out.length < n) {
      var rest = pickCharts(all, "fresh-pull", Object.keys(blocked), n - out.length, true, false);
      for (i = 0; i < rest.length && out.length < n; i++) {
        if (!blocked[rest[i].id]) {
          out.push(rest[i]);
          blocked[rest[i].id] = true;
        }
      }
    }
    return out.slice(0, n);
  }

  function startPlay(focus, skill, seed, opts) {
    opts = opts || {};
    ui.skill = skill || chooseSkill(save).skill;
    ui.focus = !!focus;
    ui.hard = !focus && !!opts.hard;
    ui.speed = !focus && !!opts.speed;
    ui.skillOnly = !focus && !!opts.skillOnly;
    ui.contrast = !!opts.contrast || (!!focus && ui.skill === "fresh-pull");
    ui.timeout = false;
    ui.quiz = null;
    var exclude = [];
    if (seed) exclude.push(seed.id);
    var n = opts.n || (focus ? 5 : 1);
    var charts;
    if (ui.contrast || (focus && ui.skill === "fresh-pull")) {
      charts = pickLookContrast(ALL, exclude, n);
    } else if (ui.skill === "no-trade") {
      charts = pickNoTradeSet(ALL, exclude, n);
    } else {
      charts = pickCharts(ALL, ui.skill, exclude, n, !!focus, ui.hard);
    }
    if (!charts.length) charts = ALL.slice(0, n);
    ui.ids = charts.map(function (s) { return s.id; });
    ui.index = 0;
    ui.qIndex = 0;
    ui.setLogs = [];
    ui.round = [];
    ui.picked = null;
    ui.ok = false;
    ui.phase = "ask";
    ui.view = "play";
    ui.lessonSkill = null;
    ui.startMs = Date.now();
    if (ui.ids[0]) markShown(ui.ids[0]);
    snapshot();
  }

  function nextFreshChart() {
    var choice = chooseSkill(save);
    startPlay(false, choice.skill, current(), { hard: choice.hard, speed: choice.speed, skillOnly: choice.skillOnly, contrast: choice.contrast });
  }

  function begin() {
    requestPersist();
    if (save.l2 && save.l2.resume && save.l2.session && Array.isArray(save.l2.session.ids) && save.l2.session.ids.length) {
      ui.view = "trade";
      if (save.l2.session.phase === "replay") l2PlayBars();
      return;
    }
    if (restoreSession()) return;
    var choice = chooseSkill(save);
    startPlay(false, choice.skill, null, { hard: choice.hard, speed: choice.speed, skillOnly: choice.skillOnly, contrast: choice.contrast });
  }

  function startSpeedClock() {
    clearSpeed();
    ui.speedLeft = 0;
    if (!ui.speed || ui.phase !== "ask" || ui.view !== "play") return;
    ui.speedLeft = Math.round(SPEED_MS / 1000);
    speedTimer = setInterval(function () {
      ui.speedLeft -= 1;
      if (ui.speedLeft <= 0) {
        clearSpeed();
        onTimeout();
        return;
      }
      var node = el("timer");
      if (node) {
        node.textContent = ui.speedLeft + "s";
        node.className = "timer" + (ui.speedLeft <= 3 ? " warn" : "");
      }
    }, 1000);
  }

  function recordAnswer(ans, timedOut) {
    var s = current();
    if (!s) return;
    var q = qidNow();
    var want = truthOf(s, q);
    var timeout = !!timedOut || ans == null;
    var got = timeout ? "" : ans;
    var correct = !timeout && got === want;
    var ms = Math.min(120000, Math.max(0, Date.now() - ui.startMs));
    var log = { id: s.id, q: q, correct: correct, ms: ms, tag: s.tag, code: s.code, timeout: timeout };
    ui.picked = timeout ? null : got;
    ui.ok = correct;
    ui.timeout = timeout;
    ui.round = ui.round.concat([log]);
    save.logs = save.logs.concat([log]);
    if (!correct && !timeout) {
      save.misses = save.misses.concat([{ id: s.id, q: q, got: got, want: want, tag: s.tag }]);
    }
    var sk = skillOfLog(log);
    if (sk) save.skills = touchSkill(save, sk, correct);
    save.points += correct ? 3 : 0;
    if (correct) {
      ui.phase = "feedback";
    } else {
      ui.lessonSkill = sk || ui.skill;
      ui.phase = "lesson";
    }
    snapshot();
  }

  function onTimeout() {
    if (ui.phase !== "ask") return;
    recordAnswer(null, true);
    render();
  }

  function closeChartAndAdvance() {
    var s = current();
    if (s) {
      var main = ui.round.filter(function (l) { return l.q !== "win"; });
      var allOk = main.length > 0 && main.every(function (l) { return l.correct; });
      var ms = main.reduce(function (sum, l) { return sum + l.ms; }, 0);
      save.charts = save.charts.concat([{ id: s.id, allOk: allOk, ms: ms }]);
      save.streak = allOk ? save.streak + 1 : 0;
      save.bestStreak = Math.max(save.bestStreak, save.streak);
      if (save.seen.indexOf(s.id) < 0) save.seen = save.seen.concat([s.id]);
      markResult(s.id, allOk);
      ui.setLogs = ui.setLogs.concat([{ id: s.id, allOk: allOk }]);
    }
    ui.round = [];
    ui.picked = null;
    ui.ok = false;
    ui.qIndex = 0;
    ui.lessonSkill = null;

    if (ui.focus) {
      var okN = ui.setLogs.filter(function (c) { return c.allOk; }).length;
      if (ui.index + 1 >= ui.ids.length) {
        if (okN >= 4) {
          ui.focus = false;
          startPlay(false, lowestSkill(save), s);
          render();
          return;
        }
        startPlay(true, ui.skill, s);
        render();
        return;
      }
      ui.index += 1;
      ui.phase = "ask";
      ui.timeout = false;
      ui.startMs = Date.now();
      if (ui.ids[ui.index]) markShown(ui.ids[ui.index]);
      snapshot();
      render();
      return;
    }

    /* normal play: one chart at a time, always the weakest skill */
    nextFreshChart();
    render();
  }

  function afterCorrect() {
    var qs = questions();
    if (ui.qIndex + 1 < qs.length) {
      ui.qIndex += 1;
      ui.picked = null;
      ui.ok = false;
      ui.timeout = false;
      ui.phase = "ask";
      ui.startMs = Date.now();
      snapshot();
      render();
      return;
    }
    closeChartAndAdvance();

  /* ---------- progress share ---------- */
  function median(xs) {
    if (!xs.length) return null;
    var a = xs.slice().sort(function (x, y) { return x - y; });
    var m = Math.floor(a.length / 2);
    return a.length % 2 ? a[m] : (a[m - 1] + a[m]) / 2;
  }

  function pct(ok, n) {

  function fmtSecs(ms) {

  function progressText() {
    var logs = save.logs || [];
    var n = logs.length;
    var ok = 0;
    var times = [];
    for (var i = 0; i < logs.length; i++) {
      if (logs[i].correct) ok += 1;
      if (!logs[i].timeout) times.push(logs[i].ms || 0);
    }
    var last = logs.slice(-50);
    var lastOk = 0;

    var unique = {};
    (save.shown || save.seen || []).forEach(function (id) { unique[id] = true; });
    var seenN = Object.keys(unique).length;

    var lines = [];
    lines.push("Saty Spotter progress");
    lines.push("Answered " + n + "  ·  overall " + pct(ok, n) + (last.length ? "  ·  last " + last.length + ": " + pct(lastOk, last.length) : ""));
    lines.push("Charts seen " + seenN + " of " + ALL.length);
    lines.push("Median time " + fmtSecs(median(times)) + "  ·  streak " + (save.streak || 0) + " (best " + (save.bestStreak || 0) + ")");
    lines.push("");
    lines.push("Skills");
    SKILL_DEFS.forEach(function (def) {
      var st = skillStats(save, def.id);
      var bit = (save.skills && save.skills[def.id]) || null;
      var lvl = skillMeter(save.logs, def.id, bit);
      var recent = lastSkillAcc(save, def.id, 20);
      var accBit;
      if (!st.n) accBit = "— (none yet)";
      else if (recent.n >= 20) accBit = pct(recent.ok, recent.n) + " last " + recent.n + ", " + pct(st.ok, st.n) + " overall (" + st.n + ")";
      else accBit = pct(st.ok, st.n) + " (" + st.n + ")";
      lines.push("• " + def.label + " — " + lvl + ", " + accBit);
    });

    var conf = {};
    (save.misses || []).forEach(function (m) {
      if (!m || !m.q) return;
      var key = m.q + "\t" + (m.want || "") + "\t" + (m.got || "");
      conf[key] = (conf[key] || 0) + 1;
    });
    var confList = Object.keys(conf).map(function (k) {
      var p = k.split("\t");
      return { q: p[0], want: p[1], got: p[2], n: conf[k] };
    }).sort(function (a, b) { return b.n - a.n; }).slice(0, 5);
    lines.push("");
    if (confList.length) {
      lines.push("Most common misses");

        var skill = sid ? skillLabel(sid) : c.q;

      });
    } else {
      lines.push("Most common misses: none yet");
    }
    var L = l2State();
    lines.push("");
    lines.push("Level 2 (Trade it)");
    if (!(L.trades && L.trades.length) && !L.sessions) {
      lines.push("No trade-it sessions yet.");
    } else {
      lines.push("Practice P&L: " + fmtR(L.rSum) + "  ·  " + fmtUsd(L.rSum * L2_PLAN_R) + " at $20/R (1 MNQ, $1.50 costs)");
      lines.push("Process grade: " + l2ProcessPct(L) + "%" + (L.processN ? " (" + L.processOk + "/" + L.processN + " checks)" : ""));
      lines.push("Sessions: " + (L.sessions || 0) + "  ·  stopped at 2 losses: " + (L.stoppedSessions || 0));
      var errs = l2ErrorSummary(L);
      if (errs.length) {
        lines.push("Common decision errors");
        errs.forEach(function (e) { lines.push("• " + e.k + " (" + e.n + ")"); });
      } else {
        lines.push("Common decision errors: none yet");

    }
    var ex = save.exam || emptyExam();
    lines.push("");
    lines.push("Saty answer key (separate from recognition)");
    if (!(ex.logs && ex.logs.length) && !ex.last) {
      lines.push("No exam attempts yet.");
    } else {
      var last = ex.last;
      if (last && last.n) lines.push("Last exam: " + last.ok + "/" + last.n + " (" + Math.round((100 * last.ok) / last.n) + "%)");
      if (ex.best) lines.push("Best: " + ex.best + "/" + SATY_EXAM.length);
      lines.push("Attempts logged: " + (ex.logs ? ex.logs.length : 0) + " answers (not counted in the recognition score above).");
    }
    var flags = save.flags || [];
    lines.push("");
    if (!flags.length) {
      lines.push("Flagged charts: none");
    } else {
      lines.push("Flagged charts (" + flags.length + ")");
      flags.forEach(function (f) {
        lines.push("• " + f.id + (f.view === "trade" ? " (Level 2)" : "") + (f.note ? " — " + f.note : ""));

  function setShareNote(msg) {

  function sendProgress() {
    var text = progressText();
    function copied() { setShareNote("Copied — paste it into chat."); }
    function fallbackTextarea() {
      try {
        var ok = window.prompt("Copy your progress and paste it into chat:", text);
        if (ok !== null) setShareNote("Copy the text and paste it into chat.");
      } catch (e2) {
        setShareNote("Could not share from this browser.");
      }
    }
    try {
      if (navigator.share) {
        navigator.share({ title: "Saty Spotter progress", text: text }).then(function () {
          setShareNote("Shared.");
        }).catch(function (err) {
          if (err && err.name === "AbortError") return;
          if (navigator.clipboard && navigator.clipboard.writeText) {
            navigator.clipboard.writeText(text).then(copied).catch(fallbackTextarea);
          } else fallbackTextarea();
        });
        return;
      }
    } catch (e) {}
    try {
      if (navigator.clipboard && navigator.clipboard.writeText) {
        navigator.clipboard.writeText(text).then(copied).catch(fallbackTextarea);
        return;
      }
    } catch (e3) {}

  }

  /* ---------- Level 2: Trade it ---------- */
  var l2Timer = null;
  function clearL2Timer() {
    if (l2Timer) { clearInterval(l2Timer); l2Timer = null; }
  }

  function l2State() {
    if (!save.l2) save.l2 = emptyL2();
    return save.l2;
  }

  function q1Unlocked(sv) {
    var a = lastSkillAcc(sv || save, "fresh-pull", 20);
    return a.n >= 20 && a.acc >= 0.8;
  }

  function l2SetupOf(s) {
    /* Truth at the packed decision bar — taught labels, no lookahead past it. */
    if (tagged618SinceBreak(s)) {
      return { action: "N", kind: "st" };
    }
    if (s.q3 === "Y" || s.tag === "gg") {
      return { action: s.q1 === "R" ? "S" : "L", kind: "gg" };
    }
    if (s.q2 === "F" && (s.code === "LT" || s.code === "ST" || s.tag === "tr")) {
      return { action: s.q1 === "R" ? "S" : "L", kind: "tr" };
    }
    return { action: "N", kind: s.tag || "none" };
  }

  function l2StopLevels(s, side) {
    var lv = s.levels;
    var last = s.bars[N_VIS - 1];
    if (side === "L") {
      return [
        { v: "trig", l: "A close back inside the trigger — first stop on a trigger entry", px: lv.pTrig, kind: "tr" },
        { v: "ema", l: "A close back beyond the 8 EMA — first stop on a Golden Gate", px: last.e8, kind: "gg" },
        { v: "pdc", l: "A close back through the previous day's close — wider pivot stop", px: lv.pdc, kind: "wide" }
      ];
    }
    return [
      { v: "trig", l: "A close back inside the trigger — first stop on a trigger entry", px: lv.mTrig, kind: "tr" },
      { v: "ema", l: "A close back beyond the 8 EMA — first stop on a Golden Gate", px: last.e8, kind: "gg" },
      { v: "pdc", l: "A close back through the previous day's close — wider pivot stop", px: lv.pdc, kind: "wide" }
    ];
  }

  function l2TargetLevels(s, side) {
    var lv = s.levels;
    if (side === "L") {
      return [
        { v: "382", l: "38.2 — first scale / Golden Gate", px: lv.p382, kind: "scale" },
        { v: "618", l: "61.8 — mid-range / Golden FIB (first official target)", px: lv.p618, kind: "tr" },
        { v: "next", l: "1 ATR — full range (ideal / runners)", px: lv.p100, kind: "ideal" }
      ];
    }
    return [
      { v: "382", l: "38.2 — first scale / Golden Gate", px: lv.m382, kind: "scale" },
      { v: "618", l: "61.8 — mid-range / Golden FIB (first official target)", px: lv.m618, kind: "tr" },
      { v: "next", l: "1 ATR — full range (ideal / runners)", px: lv.m100, kind: "ideal" }
    ];
  }

  function l2CorrectStop(kind) { return kind === "gg" ? "ema" : "trig"; }
  function l2CorrectTarget(kind) { return "618"; }

  function l2StopError(kind, picked) {
    var want = l2CorrectStop(kind);
    var setupName = kind === "gg" ? "Golden Gate" : "trigger";
    var wantTxt = want === "ema" ? "a close back beyond the 8 EMA" : "a close back inside the trigger";
    if (picked === "pdc") return "Wrong stop on a " + setupName + ": previous close is a valid wider pivot stop, but the taught first stop is " + wantTxt;
    if (picked === "ema") return "Wrong stop on a " + setupName + ": the 8 is the Golden Gate / ribbon-pullback stop. On a trigger entry, use a close back inside the trigger";
    if (picked === "trig") return "Wrong stop on a " + setupName + ": the trigger stop is for a first-close trigger entry. On a Golden Gate, use a close back beyond the 8";
    return "Wrong stop on a " + setupName;
  }

  function l2StopWhy(setup, picked, okStop) {
    if (setup.action === "N") return "";
    if (okStop) {
      return setup.kind === "gg"
        ? "Taught stop: a close back beyond the 8, because this was a Golden Gate (ribbon pullback) entry."
        : "Taught stop: a close back inside the trigger, because this was a first-close trigger entry.";
    }
    if (picked === "pdc") {
      return "Previous close is a valid wider pivot stop when you need a little room, but the taught first stop here is " + (setup.kind === "gg" ? "a close back beyond the 8." : "a close back inside the trigger.");
    }
    if (setup.kind === "gg") return "That stop doesn't match a Golden Gate entry. Use a close back beyond the 8 (the ribbon you pulled back to). The trigger stop is for a first-close trigger entry.";
    return "That stop doesn't match a trigger entry. Use a close back inside the trigger. The 8 is the stop for a Golden Gate / ribbon pullback.";
  }

  function l2Simulate(s, side, stopPx, tgtPx, from) {
    var start = from == null ? N_VIS : from;
    var entry = s.bars[Math.max(0, start - 1)].c;
    var dir = side === "L" ? 1 : -1;
    var exitPx = null, reason = "time", hitBar = s.bars.length - 1;
    var i, b, hitStop, hitTgt;
    for (i = start; i < s.bars.length; i++) {
      b = s.bars[i];
      /* Stops fill on a 15-minute CLOSE through the level (the taught Saty rule), not a wick. Targets fill on a tag (wick). If both happen on the same bar, the stop wins. */
      hitStop = dir > 0 ? b.c <= stopPx : b.c >= stopPx;
      hitTgt = dir > 0 ? b.h >= tgtPx : b.l <= tgtPx;
      if (hitStop && hitTgt) { exitPx = stopPx; reason = "stop"; hitBar = i; break; }
      if (hitStop) { exitPx = stopPx; reason = "stop"; hitBar = i; break; }
      if (hitTgt) { exitPx = tgtPx; reason = "target"; hitBar = i; break; }
    }
    if (exitPx == null) {
      exitPx = s.bars[s.bars.length - 1].c;
      reason = "time";
      hitBar = s.bars.length - 1;
    }
    var riskPts = Math.max(1, Math.abs(entry - stopPx));
    var grossPts = dir * (exitPx - entry);
    var riskUsd = riskPts * L2_POINT;
    var grossUsd = grossPts * L2_POINT;
    var netUsd = grossUsd - L2_COST;
    var r = riskUsd ? netUsd / riskUsd : 0;
    return {
      entry: entry, exit: exitPx, reason: reason, hitBar: hitBar,
      riskPts: riskPts, grossPts: grossPts, r: r, dollars: netUsd,
      planDollars: r * L2_PLAN_R
    };
  }

  function l2PickQueue() {
    var taken = {};
    (save.l2.trades || []).slice(-40).forEach(function (t) { if (t.id) taken[t.id] = true; });
    var trades = [], skips = [];
    ALL.forEach(function (s) {
      if (taken[s.id]) return;
      var setup = l2SetupOf(s);
      if (setup.action === "N") skips.push(s);
      else trades.push(s);
    });
    function take(xs, n) {
      var copy = sortCandidates(xs, false);
      return copy.slice(0, n);
    }
    /* Weight toward no-trade: his top leak is taking trades on no-trade charts. */
    var out = take(trades, 3).concat(take(skips, 7));
    if (out.length < 8) {
      var rest = sortCandidates(ALL.filter(function (s) { return !taken[s.id]; }), false);
      out = out.concat(rest);
    }
    /* shuffle mix but keep deterministic-ish by tmin after pairing */
    out.sort(function (a, b) { return ((a.tmin + 13) * 7 % 97) - ((b.tmin + 13) * 7 % 97); });
    return out.slice(0, 10).map(function (s) { return s.id; });
  }

  function l2Current() {
    var ses = l2State().session;
    if (!ses || !ses.ids) return null;
    return byId(ALL, ses.ids[ses.index]) || null;
  }

  function l2Snap() {
    l2State().resume = ui.view === "trade";
    writeSave(save);
  }

  function l2StartSession(force) {
    clearL2Timer();
    var L = l2State();
    if (!force && L.session && L.session.phase && L.session.phase !== "session-end" && L.session.ids && L.session.ids.length) {
      ui.view = "trade";
      if (L.session.phase === "replay") l2PlayBars();
      return;
    }
    L.session = {
      ids: l2PickQueue(),
      index: 0,
      shown: 16,
      phase: "replay",
      pick: null,
      stop: null,
      target: null,
      entryEnd: null,
      losses: 0,
      trades: [],
      note: "",
      outcome: null
    };
    L.sessions += 1;
    ui.view = "trade";
    l2Snap();
    l2PlayBars();
  }

  function l2PlayBars() {
    clearL2Timer();
    var ses = l2State().session;
    if (!ses) return;
    ses.phase = "replay";
    if (!ses.shown || ses.shown < 16) ses.shown = 16;
    l2Snap();
    l2Timer = setInterval(function () {
      var cur = l2State().session;
      if (!cur || cur.phase !== "replay") { clearL2Timer(); return; }
      if (cur.shown >= N_VIS) {
        clearL2Timer();
        cur.phase = "decide";
        cur.shown = N_VIS;
        l2Snap();
        render();
        return;
      }
      cur.shown += 1;
      l2Snap();
      render();
    }, L2_PLAY_MS);
  }

  function l2JumpToDecide() {
    clearL2Timer();
    var ses = l2State().session;
    if (!ses) return;
    ses.shown = N_VIS;
    ses.phase = "decide";
    l2Snap();
    render();

  function l2NextBar() {
    clearL2Timer();
    var ses = l2State().session;
    if (!ses) return;
    if (ses.shown >= N_VIS) {
      ses.phase = "decide";
    } else {
      ses.shown += 1;
      if (ses.shown >= N_VIS) ses.phase = "decide";
      else ses.phase = "replay";

  function l2Decide(pick) {
    var ses = l2State().session;
    var s = l2Current();
    if (!ses || !s || ses.phase !== "decide") return;
    ses.pick = pick;
    ses.entryEnd = ses.shown;
    var setup = l2SetupOf(s);
    if (pick === "W" || pick === "N") {
      l2FinishPass(s, ses, setup, pick);
      return;
    }
    ses.phase = "stop";
    l2Snap();
    render();
  }

  function l2ChooseStop(v) {
    var ses = l2State().session;
    if (!ses || ses.phase !== "stop") return;
    ses.stop = v;
    ses.phase = "target";
    l2Snap();
    render();
  }

  function l2ChooseTarget(v) {
    var ses = l2State().session;
    var s = l2Current();
    if (!ses || !s || ses.phase !== "target") return;
    ses.target = v;
    l2FinishTake(s, ses);
  }

  function l2GradeSetup(setup, pick) {
    if (setup.action === "N") return pick === "N" || pick === "W";
    if (pick === "L" || pick === "S") return pick === setup.action;
    return false;
  }

  function l2FinishPass(s, ses, setup, pick) {
    var okSetup = l2GradeSetup(setup, pick);
    var process = { setup: okSetup, stop: true, target: true };
    var gradeN = 1;
    var gradeOk = okSetup ? 1 : 0;
    var rec = {
      id: s.id,
      pick: pick,
      kind: setup.kind,
      want: setup.action,
      okSetup: okSetup,
      r: 0,
      dollars: 0,
      planDollars: 0,
      reason: pick === "W" ? "wait" : "no-trade",
      process: process
    };
    l2Commit(ses, rec, gradeOk, gradeN);
    if (!okSetup) {
      if (setup.action !== "N" && (pick === "N" || pick === "W")) l2Error("Passed on a " + (setup.kind === "gg" ? "Golden Gate" : "trigger") + " (" + (setup.action === "L" ? "long" : "short") + ")");
    }
    ses.phase = "outcome";
    ses.outcome = rec;
    ses.note = okSetup
      ? (setup.action === "N" ? "Right to stand aside. " + noTradeDetail(s) : "You passed. That setup was a trade.")
      : (setup.action === "N" ? "There was no trade here. " + noTradeDetail(s) : "That was a real " + (setup.action === "L" ? "long" : "short") + " " + (setup.kind === "gg" ? "Golden Gate" : "trigger") + ". Passing missed it.");
    l2Snap();
    render();
  }

  function l2FinishTake(s, ses) {
    var setup = l2SetupOf(s);
    var side = ses.pick;
    var stopWant = l2CorrectStop(setup.kind);
    var tgtWant = l2CorrectTarget(setup.kind);
    var okSetup = l2GradeSetup(setup, side);
    var okStop = setup.action !== "N" && ses.stop === stopWant;
    var okTgt = setup.action !== "N" && ses.target === tgtWant;
    if (setup.action === "N") { okStop = false; okTgt = false; }
    var stops = l2StopLevels(s, side);
    var tgts = l2TargetLevels(s, side);
    var stop = stops.filter(function (o) { return o.v === ses.stop; })[0] || stops[0];
    var tgt = tgts.filter(function (o) { return o.v === ses.target; })[0] || tgts[0];
    var sim = l2Simulate(s, side, stop.px, tgt.px, N_VIS);
    var process = { setup: okSetup, stop: okStop, target: okTgt };
    var gradeN = 3;
    var gradeOk = (okSetup ? 1 : 0) + (okStop ? 1 : 0) + (okTgt ? 1 : 0);
    var rec = {
      id: s.id,
      pick: side,
      kind: setup.kind,
      want: setup.action,
      okSetup: okSetup,
      okStop: okStop,
      okTarget: okTgt,
      stop: ses.stop,
      target: ses.target,
      r: sim.r,
      dollars: sim.dollars,
      planDollars: sim.planDollars,
      reason: sim.reason,
      entry: sim.entry,
      exit: sim.exit,
      stopPx: stop.px,
      tgtPx: tgt.px,
      hitBar: sim.hitBar,
      process: process
    };
    l2Commit(ses, rec, gradeOk, gradeN);
    if (!okSetup) {
      if (setup.action === "N") l2Error("Took a " + (side === "L" ? "long" : "short") + " when it was no trade");
      else if (side !== setup.action) l2Error("Took the wrong side (" + (side === "L" ? "long" : "short") + " vs " + (setup.action === "L" ? "long" : "short") + ")");
    }
    if (okSetup && !okStop) l2Error(l2StopError(setup.kind, ses.stop));
    if (okSetup && !okTgt) l2Error("Wrong target on a " + (setup.kind === "gg" ? "Golden Gate" : "trigger") + ": first official target is mid-range 61.8 (the Golden FIB). Picked " + (ses.target === "382" ? "38.2 (a first scale, not the official target)" : ses.target === "618" ? "61.8" : "1 ATR (the ideal runner — take 61.8 first)"));
    var praise = okSetup && (sim.r < 0)
      ? "Good process, even though this one didn't pay. That's a fair stop."
      : (!okSetup && sim.r > 0)
        ? "This one made money, but the process was off. Grade the decision, not the luck."
        : (okSetup && okStop && okTgt)
          ? "Setup, stop, and target all match the rules."
          : "";
    var stopWhy = l2StopWhy(setup, ses.stop, okStop);
    ses.phase = "outcome";
    ses.outcome = rec;
    ses.note = (praise ? praise + " " : "") + stopWhy;
    if (setup.action === "N") ses.note = (ses.note ? ses.note + " " : "") + noTradeDetail(s);
    l2Snap();
    render();
  }

  function l2Commit(ses, rec, gradeOk, gradeN) {
    var L = l2State();
    L.trades = (L.trades || []).concat([rec]);
    ses.trades = (ses.trades || []).concat([rec]);
    L.rSum += rec.r || 0;
    L.dollars += rec.dollars || 0;
    L.processOk += gradeOk;
    L.processN += gradeN;
    if (rec.pick === "L" || rec.pick === "S") {
      if (rec.r < 0) ses.losses += 1;
    }
  }

  function l2Error(msg) {
    var L = l2State();
    L.errors = (L.errors || []).concat([msg]);
    if (L.errors.length > 200) L.errors = L.errors.slice(-200);
  }

  function l2AfterOutcome() {
    var ses = l2State().session;
    if (!ses) return;
    if (ses.losses >= L2_LOSS_STOP) {
      ses.phase = "session-end";
      l2State().stoppedSessions += 1;
      l2Snap();
      render();
      return;
    }
    if (ses.index + 1 >= ses.ids.length) {
      ses.phase = "session-end";
      l2Snap();
      render();
      return;
    }
    ses.index += 1;
    ses.shown = 16;
    ses.phase = "replay";
    ses.pick = null;
    ses.stop = null;
    ses.target = null;
    ses.entryEnd = null;
    ses.outcome = null;
    ses.note = "";
    l2Snap();
    l2PlayBars();
    render();
  }

  function l2Leave() {
    clearL2Timer();
    l2State().resume = false;
    ui.view = "play";
    snapshot();
    render();
  }

  function l2ProcessPct(L) {
    return L.processN ? Math.round((100 * L.processOk) / L.processN) : 0;
  }

  function l2ErrorSummary(L) {
    var counts = {};
    (L.errors || []).forEach(function (e) { counts[e] = (counts[e] || 0) + 1; });
    return Object.keys(counts).map(function (k) { return { k: k, n: counts[k] }; })
      .sort(function (a, b) { return b.n - a.n; }).slice(0, 5);
  }

  function l2ReasonLabel(reason) {
    if (reason === "stop") return "stopped on a 15-minute close";
    if (reason === "target") return "tagged the target";
    if (reason === "time") return "time — no close-stop or target tag in the next 3 hours";
    if (reason === "wait") return "waited";
    if (reason === "no-trade") return "no trade";
    return reason || "";
  }

  function fmtR(r) {
    if (r == null || !isFinite(r)) return "—";
    var sign = r > 0 ? "+" : "";
    return sign + r.toFixed(2) + "R";
  }

  function fmtUsd(n) {
    if (n == null || !isFinite(n)) return "—";
    var sign = n > 0 ? "+" : n < 0 ? "−" : "";
    return sign + "$" + Math.abs(n).toFixed(2);
  }

  function examNext() {
    var E = examState();
    var ses = E.session;
    if (!ses) return;
    if (ses.index + 1 >= ses.ids.length) {
      var ok = 0;
      (ses.answers || []).forEach(function (a) { if (a.correct) ok += 1; });
      var n = ses.ids.length;
      E.last = { ok: ok, n: n, at: Date.now() };
      if (ok > (E.best || 0)) E.best = ok;
      ses.phase = "done";
      ses.okCount = ok;
      writeSave(save);
      render();
      return;
